# Default gitleaks rules plus checks for identifiers the privacy rules forbid.
# The pre-push deny-list in $NULLBILL_HOME covers owner-specific strings.
[extend]
useDefault = true

[[rules]]
id = "mac-address"
description = "MAC address other than NullBill's generated 02:4e:42 range"
regex = '''(?i)\b[0-9a-f]{2}(?::[0-9a-f]{2}){5}\b'''
[rules.allowlist]
regexes = ['''(?i)^02:4e:42:''']

[[rules]]
id = "public-ipv4"
description = "IPv4 outside RFC 1918, RFC 5737, loopback, link-local and 100.64/10"
# Not preceded by '=', '.', '-' or a word character, so version pins such as
# pkg==1.2.3.4 do not match.
regex = '''(?:^|[^\w.=-])((?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3})\b'''
secretGroup = 1
[rules.allowlist]
regexes = [
  '''^10\.''',
  '''^172\.(?:1[6-9]|2\d|3[01])\.''',
  '''^192\.168\.''',
  '''^192\.0\.2\.''',
  '''^198\.51\.100\.''',
  '''^203\.0\.113\.''',
  '''^127\.''',
  '''^169\.254\.''',
  '''^0\.0\.0\.0$''',
  '''^100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.''',
  '''^255\.''',
  # Terraria's version numbers (1.4.5.8), which have an address's shape.
  '''^1\.4\.\d\.\d$''',
]

# Stand-in credentials in tests and the page demo must not have a provider's
# shape: GitHub's secret scanning raised a public-leak alert on a fake
# Tailscale auth key. Write a fake as the prefix the page checks for and one
# plain word (tskey-auth-notarealkey, sk-ant-api-NOTAREALKEY123).
[[rules]]
id = "tailscale-key-shape"
description = "Tailscale key shape (tskey-<kind>-<id>-<secret>); use tskey-<kind>-<word> for a stand-in"
regex = '''tskey-[a-z]+-[A-Za-z0-9]+-[A-Za-z0-9]+'''
keywords = ["tskey-"]
[rules.allowlist]
# The commits that added the old stand-ins, which history keeps.
commits = [
  "069e1404ab008374c1d77d2970c27d15a118795f",
  "5a136041af4efab7bb9bd32202348a5155c7f8f0",
  "b9deed652cc08ebb757b4f1380667f260a82bf98",
  "f70a9dfb62d16e6c91fd7872c3c5f8aae83ecf39",
]

[[rules]]
id = "anthropic-key-shape"
description = "Anthropic key shape (sk-ant-<kind><nn>-...); use sk-ant-<kind>-<word> for a stand-in"
regex = '''sk-ant-[a-z]+[0-9]{2}-[A-Za-z0-9_-]+'''
keywords = ["sk-ant-"]
[rules.allowlist]
# The commits that added the old stand-ins, which history keeps.
commits = [
  "069e1404ab008374c1d77d2970c27d15a118795f",
  "5a136041af4efab7bb9bd32202348a5155c7f8f0",
  "b9deed652cc08ebb757b4f1380667f260a82bf98",
  "f70a9dfb62d16e6c91fd7872c3c5f8aae83ecf39",
]
