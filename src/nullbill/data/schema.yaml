# JSON Schema (draft 2020-12) for NullBill data.
#   $defs.config: $NULLBILL_HOME/config.yaml as the owner writes it.
#   $defs.model:  catalog.yaml merged with config.yaml; plan reads this.
# A service, zone, role or person added in config.yaml must be complete
# after the merge, so the model schema is the strict one.
$schema: https://json-schema.org/draft/2020-12/schema

$defs:
  name:
    type: string
    pattern: "^[a-z][a-z0-9-]{0,30}$"

  # A local model's name, as clients of the model gateway ask for it.
  model_name:
    type: string
    pattern: "^[a-z][a-z0-9.-]{0,40}$"

  ref:
    # zone:<name>, service:<name>, role:<name>; zone:* means every zone;
    # host is the PVE host itself. shared: the people whose own `services`
    # list names the service this port belongs to (docs/adr/0011-people.md).
    type: string
    pattern: "^(zone:(\\*|[a-z][a-z0-9-]*)|service:[a-z][a-z0-9-]*|role:[a-z][a-z0-9-]*|host|shared)$"

  size:
    type: object
    additionalProperties: false
    properties:
      cores: {type: integer, minimum: 1}
      memory_mib: {type: integer, minimum: 128}
      disk_gib: {type: integer, minimum: 1}

  port:
    type: object
    additionalProperties: false
    required: [port, proto, from]
    properties:
      port: {type: integer, minimum: 1, maximum: 65535}
      proto: {enum: [tcp, udp]}
      from: {type: array, minItems: 1, items: {$ref: "#/$defs/ref"}}

  zone:
    type: object
    additionalProperties: false
    properties:
      index: {type: integer, minimum: 1, maximum: 254}
      description: {type: string}
      # direct: internet through the router; proxy: only via egress-proxy;
      # none: no internet. Omitted means none.
      egress: {enum: [direct, proxy, none]}

  role:
    type: object
    additionalProperties: false
    properties:
      description: {type: string}
      reach: {type: array, items: {$ref: "#/$defs/ref"}}

  person:
    type: object
    additionalProperties: false
    required: [role, login]
    properties:
      role: {$ref: "#/$defs/name"}
      # The person's Tailscale login, e.g. dev-b@example.internal.
      login: {type: string, pattern: "^[^@\\s]+@[^@\\s]+$"}
      # SSH public keys (owner.py): the owner's go on the workspace and on
      # the owner's own Forgejo user.
      ssh_keys:
        type: array
        maxItems: 20
        items: {type: string, pattern: "^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\\.com|sk-ecdsa-sha2-nistp256@openssh\\.com) [A-Za-z0-9+/]{40,}={0,3}( [^\\r\\n]{0,200})?$"}
      # Services this person may open besides what their role reaches: the
      # ports of each that list `shared` in `from`, and nothing else.
      services: {type: array, uniqueItems: true, items: {$ref: "#/$defs/name"}}

  service:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      # Host part of the service address: not in the pools' lease range,
      # .128 to .191, and below the PVE host's .254.
      id:
        type: integer
        anyOf: [{minimum: 1, maximum: 127}, {minimum: 192, maximum: 253}]
      kind: {enum: [lxc, vm, vm-pool]}
      zone: {$ref: "#/$defs/name"}
      workload: {$ref: "#/$defs/name"}
      description: {type: string}
      attach: {const: all-zones}
      # In the pool the agent's PVE token may power-manage and snapshot,
      # and reachable by SSH from the operator. Never in mgmt or access.
      agent_managed: {type: boolean}
      # Made by install.sh, not OpenTofu: the nullbill container itself,
      # which runs apply (docs/adr/0006-nullbill-on-the-server.md).
      installed: {type: boolean}
      # The cloud image a Linux VM boots; debian-cloud when omitted.
      image: {enum: [debian-cloud, debian-13-cloud]}
      # Names egress-proxy forwards for this guest only, on top of
      # proxy.allow. Only for fixed-address guests in egress: proxy zones.
      proxy_allow: {type: array, uniqueItems: true, items: {$ref: "#/$defs/domain_pattern"}}
      gpu: {type: boolean}
      # false leaves the guest out of the nightly backups: for a guest that
      # setup builds again from what it pins and that holds nothing of the
      # owner's. Omitted means backed up.
      backup: {type: boolean}
      # Set when NullBill does not put the program behind ports in place:
      # who does, or why nothing does yet. verify reports a flow to such a
      # port that finds nothing listening as DEGRADED with this text.
      listener: {type: string, minLength: 1}
      # How a service with `shared` ports reads to the owner who gives it to
      # a person and to that person (people.py). In `open`, {host} becomes
      # the service's name, or its address while names are off, {ip}
      # always its address, {port} its first shared port and {version} a
      # game server's version. Without `open`, each shared port is listed.
      # `access` is for the owner alone, beside the tick: what a person can
      # do behind the port, which is the program's business and not
      # NullBill's (the account they need, what it may do).
      share:
        type: object
        additionalProperties: false
        properties:
          title: {type: string, minLength: 1, maxLength: 40}
          what: {type: string, minLength: 1, maxLength: 120}
          access: {type: string, minLength: 1, maxLength: 200}
          open: {type: string, minLength: 1, maxLength: 120}
          note: {type: string, minLength: 1, maxLength: 200}
      floor: {$ref: "#/$defs/size"}
      grow: {type: integer, minimum: 1}
      # vm-pool: the labels a CI job names in runs-on to land on this pool.
      runs_on: {type: array, minItems: 1, uniqueItems: true, items: {$ref: "#/$defs/name"}}
      ports: {type: array, items: {$ref: "#/$defs/port"}}

  gpu_pin:
    type: object
    additionalProperties: false
    properties:
      # host-shared, or vm:<service> to pass the whole GPU to one VM.
      owner: {type: string, pattern: "^(host-shared|vm:[a-z][a-z0-9-]*)$"}
      # Answer for GPUs whose VRAM the probe cannot read.
      vram_mib: {type: integer, minimum: 1}
      # VRAM budget per consuming service, host-shared GPUs only.
      consumers:
        type: object
        additionalProperties: {type: integer, minimum: 1}

  disk_pin:
    type: object
    additionalProperties: false
    required: [use]
    properties:
      # legacy: keep the data, mount it on the host and share it to the
      # owner (docs/adr/0007-legacy-disks.md). Never chosen by default.
      # storage: an LVM-thin PVE storage of its own; guests stay where the
      # plan puts them. Never chosen by default.
      use: {enum: [pbs, ignore, legacy, storage]}
      # Required to let apply format a disk that carries signatures.
      wipe: {type: boolean}
      # legacy only. ro (default) or rw; rw only on NTFS that checks clean.
      mode: {enum: [ro, rw]}
      # legacy, mode rw only. Journals Windows left open that apply may
      # discard before the mount, each by the fingerprint the probe read
      # (partitions[].journal): what that Windows session had not finished
      # writing is lost. A journal not named here is never discarded.
      discard_journal: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: "^j[0-9a-f]{12}$"}}
      # legacy only. Partition numbers to keep; default every partition
      # with NTFS, exFAT or FAT.
      partitions: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 1}}
      # legacy only. false mounts it on the host without sharing it.
      share: {type: boolean}
      # legacy only. Share and mount name; default from the partition label.
      name: {$ref: "#/$defs/name"}
      # Converting a kept (legacy) disk, with wipe: true, takes one of these.
      # evacuate: a PVE storage that receives a verified copy of its files,
      # shared from the files guest from then on.
      evacuate: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$"}
      # discard_data: the owner has the files elsewhere; they are lost.
      discard_data: {const: true}
      # storage only. The PVE storage and volume group name; default nb-data.
      storage: {type: string, pattern: "^nb-[a-z][a-z0-9-]{0,30}$"}

  # How a workload may be unloaded (catalog.yaml's power).
  power:
    type: object
    additionalProperties: false
    properties:
      # What the page and the alerts call it.
      title: {type: string, minLength: 1, maxLength: 40}
      run: {enum: [always, on-demand]}
      stop: {enum: [auto, ask, manual]}
      idle_minutes: {type: integer, minimum: 5, maximum: 10080}
      busy:
        type: object
        additionalProperties: false
        properties:
          # Percent of one core, over a minute, that counts as use.
          cpu_pct: {type: integer, minimum: 1, maximum: 6400}

  override:
    type: object
    additionalProperties: false
    properties:
      cores: {type: integer, minimum: 1}
      memory_mib: {type: integer, minimum: 128}
      disk_gib: {type: integer, minimum: 1}
      count: {type: integer, minimum: 1}

  common:
    network:
      type: object
      additionalProperties: false
      properties:
        base: {type: string, pattern: "^10\\.[0-9]{1,3}\\.0\\.0/16$"}
        domain: {type: string, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"}
        vmid_base: {type: integer, minimum: 100, maximum: 999000}
    host:
      type: object
      additionalProperties: false
      properties:
        reserve: {$ref: "#/$defs/size"}
        # The reserve on hosts with less memory than below_mib.
        reserve_small:
          type: object
          additionalProperties: false
          properties:
            memory_mib: {type: integer, minimum: 1024}
            below_mib: {type: integer, minimum: 1024}
        # Percent of a container's memory limit the plan counts as used.
        container_share_pct: {type: integer, minimum: 10, maximum: 100}
        console:
          type: object
          additionalProperties: false
          properties:
            enabled: {type: boolean}
            memory_mib: {type: integer, minimum: 256}
        # Ports on the PVE host itself. Role sources arrive through the VPN.
        ports: {type: array, items: {$ref: "#/$defs/port"}}
    zones: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/zone"}}
    roles: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/role"}}
    services: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/service"}}
    people: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/person"}}
    engines:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [min_gpus, engine]
        properties:
          min_gpus: {type: integer, minimum: 1}
          max_gpus: {type: integer, minimum: 1}
          engine: {enum: [llama.cpp]}
    models: {type: object, propertyNames: {$ref: "#/$defs/model_name"}, additionalProperties: {$ref: "#/$defs/llm"}}
    # One entry per game NullBill has a role for (ansible/roles/game_<name>),
    # and under any other name one more server of one of those games.
    games:
      type: object
      propertyNames: {$ref: "#/$defs/name"}
      properties:
        minecraft: {$ref: "#/$defs/game_minecraft"}
        terraria: {$ref: "#/$defs/game_terraria"}
        factorio: {$ref: "#/$defs/game_factorio"}
      additionalProperties: {$ref: "#/$defs/game_more"}
    tailnet:
      type: object
      additionalProperties: false
      properties:
        free_limits:
          type: object
          additionalProperties: false
          properties:
            users: {type: integer, minimum: 1}
            groups: {type: integer, minimum: 1}
            tagged_devices: {type: integer, minimum: 1}
        port_mapping: {type: boolean}
    verify:
      type: object
      additionalProperties: false
      properties:
        public_name: {$ref: "#/$defs/domain_pattern"}
    updates:
      type: object
      additionalProperties: false
      properties:
        # Local time, HH:MM, when a guest whose update needs a reboot reboots.
        reboot_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
    images:
      type: object
      additionalProperties: false
      properties:
        debian-lxc: {$ref: "#/$defs/image"}
        debian-cloud: {$ref: "#/$defs/image"}
        debian-13-cloud: {$ref: "#/$defs/image"}
    proxy:
      type: object
      additionalProperties: false
      properties:
        allow: {type: array, uniqueItems: true, items: {$ref: "#/$defs/domain_pattern"}}
    power: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/power"}}

  # A local model llama.cpp serves (catalog.yaml's models).
  llm:
    type: object
    additionalProperties: false
    properties:
      url: {type: string, pattern: "^https://"}
      sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      size_mib: {type: integer, minimum: 1}
      vram_mib: {type: integer, minimum: 1}
      context: {type: integer, minimum: 512}
      # The model card's sampling, llama-server's default for a request
      # that sets none.
      sampling:
        type: object
        additionalProperties: false
        properties:
          temperature: {type: number, minimum: 0}
          top_p: {type: number, minimum: 0, maximum: 1}
          top_k: {type: integer, minimum: 0}
          min_p: {type: number, minimum: 0, maximum: 1}
          presence_penalty: {type: number, minimum: -2, maximum: 2}
          repeat_penalty: {type: number, minimum: 0}
      reasoning: {enum: ["on", "off", auto]}
      reasoning_effort: {enum: [minimal, low, medium, high, xhigh, max]}
      cache_type: {enum: [f16, q8_0]}

  # A game server's pinned download (catalog.yaml's games).
  game_pin:
    version: {type: string, pattern: "^[0-9][0-9A-Za-z.+_-]{0,30}$"}
    url: {type: string, pattern: "^https://"}
    sha256: {type: string, pattern: "^[0-9a-f]{64}$"}

  # The server's own options, by its own names; NullBill's stay NullBill's
  # (games.py's MANAGED).
  game_settings:
    type: object
    propertyNames: {type: string, pattern: "^[A-Za-z][A-Za-z0-9._-]{0,60}$"}
    # One line each: a second line in Terraria's file would be another key.
    additionalProperties: {type: [string, integer, number, boolean], pattern: "^[^\\r\\n]*$"}

  # One more server of a game: a guest, a workload and a rule for when it
  # runs, all of this entry's name (model.py's _more_games makes them from
  # the game's own). `game` says which; `id` is its address like a
  # service's, from the range of the owner's own. The rest is what the
  # game's own entry takes, each server with its own title, settings and
  # admins; the pinned download is the game's unless pinned here, and an
  # agreement (eula) is given once, under the game's own name.
  game_more:
    type: object
    required: [game, id]
    properties:
      game: {enum: [minecraft, terraria, factorio]}
      id:
        type: integer
        anyOf: [{minimum: 64, maximum: 127}, {minimum: 192, maximum: 253}]
      title: {type: string, minLength: 1, maxLength: 40}

  game_minecraft:
    type: object
    additionalProperties: false
    properties:
      title: {type: string, minLength: 1}
      version: {$ref: "#/$defs/game_pin/version"}
      url: {$ref: "#/$defs/game_pin/url"}
      sha256: {$ref: "#/$defs/game_pin/sha256"}
      java:
        type: object
        additionalProperties: false
        properties:
          version: {$ref: "#/$defs/game_pin/version"}
          url: {$ref: "#/$defs/game_pin/url"}
          sha256: {$ref: "#/$defs/game_pin/sha256"}
      # true: the owner agrees to https://aka.ms/MinecraftEULA.
      eula: {type: boolean}
      # Players who are operators, by their Minecraft names.
      admins: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Za-z0-9_]{3,16}$"}}
      # server.properties keys.
      settings: {$ref: "#/$defs/game_settings"}

  game_terraria:
    type: object
    additionalProperties: false
    properties:
      title: {type: string, minLength: 1}
      version: {$ref: "#/$defs/game_pin/version"}
      url: {$ref: "#/$defs/game_pin/url"}
      sha256: {$ref: "#/$defs/game_pin/sha256"}
      # The server's config file keys (serverconfig.txt).
      settings: {$ref: "#/$defs/game_settings"}

  game_factorio:
    type: object
    additionalProperties: false
    properties:
      title: {type: string, minLength: 1}
      version: {$ref: "#/$defs/game_pin/version"}
      url: {$ref: "#/$defs/game_pin/url"}
      sha256: {$ref: "#/$defs/game_pin/sha256"}
      # The Space Age expansion's mods, for a map made from then on.
      space_age: {type: boolean}
      # Players who are admins, by their factorio.com names.
      admins: {type: array, uniqueItems: true, items: {type: string, pattern: "^[A-Za-z0-9_.-]{1,60}$"}}
      # server-settings.json keys.
      settings: {$ref: "#/$defs/game_settings"}

  image:
    type: object
    additionalProperties: false
    required: [url, sha512]
    properties:
      url: {type: string, pattern: "^https?://"}
      sha512: {type: string, pattern: "^[0-9a-f]{128}$"}

  domain_pattern:
    # A host name; a leading dot also matches its subdomains.
    type: string
    pattern: "^\\.?[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  config:
    type: object
    additionalProperties: false
    properties:
      target:
        type: object
        additionalProperties: false
        required: [ssh]
        properties:
          # ssh destination of the PVE host, e.g. root@pve.internal
          ssh: {type: string, minLength: 1}
      intent:
        type: object
        additionalProperties: false
        properties:
          workloads:
            type: array
            uniqueItems: true
            items: {$ref: "#/$defs/name"}
      network: {$ref: "#/$defs/common/network"}
      host: {$ref: "#/$defs/common/host"}
      zones: {$ref: "#/$defs/common/zones"}
      roles: {$ref: "#/$defs/common/roles"}
      services: {$ref: "#/$defs/common/services"}
      people: {$ref: "#/$defs/common/people"}
      proxy: {$ref: "#/$defs/common/proxy"}
      # port_mapping: false keeps the router from asking the home router for
      # Tailscale's port (direct.py).
      tailnet: {$ref: "#/$defs/common/tailnet"}
      updates: {$ref: "#/$defs/common/updates"}
      images: {$ref: "#/$defs/common/images"}
      verify: {$ref: "#/$defs/common/verify"}
      power: {$ref: "#/$defs/common/power"}
      models: {$ref: "#/$defs/common/models"}
      games: {$ref: "#/$defs/common/games"}
      gpus:
        # Keyed by PCI address as the probe reports it.
        type: object
        # Quote them: YAML 1.1 reads an unquoted 0000:01:00.0 as a number.
        propertyNames: {type: string, pattern: "^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\\.[0-7]$"}
        additionalProperties: {$ref: "#/$defs/gpu_pin"}
      disks:
        # Keyed by the disk id the probe reports.
        type: object
        additionalProperties: {$ref: "#/$defs/disk_pin"}
      overrides:
        type: object
        propertyNames: {$ref: "#/$defs/name"}
        additionalProperties: {$ref: "#/$defs/override"}
      inference:
        type: object
        additionalProperties: false
        properties:
          engine: {enum: [llama.cpp]}
          # A name from models.
          model: {$ref: "#/$defs/model_name"}
      media:
        type: object
        additionalProperties: false
        properties:
          # Jellyfin transcodes on the host's integrated Intel graphics when
          # the probe finds them (auto), or on the CPU.
          transcode: {enum: [auto, cpu]}
      backups:
        type: object
        additionalProperties: false
        properties:
          # Only while PBS has no disk of its own: the size of the datastore
          # volume beside the guests (docs/adr/0017-backups-on-one-disk.md).
          # Default 64, or what the storage has left. It can grow, not shrink.
          size_gib: {type: integer, minimum: 16, maximum: 4096}

  model:
    type: object
    required: [network, host, zones, roles, services, people, engines, models, games, proxy, tailnet, images, verify, updates, power]
    properties:
      network: {$ref: "#/$defs/common/network", required: [base, domain, vmid_base]}
      host:
        allOf:
          - {$ref: "#/$defs/common/host"}
          - required: [reserve]
            properties:
              reserve: {required: [cores, memory_mib]}
      zones:
        type: object
        additionalProperties:
          allOf: [{$ref: "#/$defs/zone"}, {required: [index]}]
      roles:
        type: object
        additionalProperties:
          allOf: [{$ref: "#/$defs/role"}, {required: [reach]}]
      services:
        type: object
        additionalProperties:
          allOf:
            - {$ref: "#/$defs/service"}
            - required: [id, kind, zone, workload, floor]
              properties:
                floor: {required: [cores, memory_mib, disk_gib]}
      people: {$ref: "#/$defs/common/people"}
      engines: {$ref: "#/$defs/common/engines"}
      models:
        type: object
        propertyNames: {$ref: "#/$defs/model_name"}
        additionalProperties:
          allOf: [{$ref: "#/$defs/llm"}, {required: [url, sha256, size_mib, vram_mib, context, sampling]}]
      games:
        allOf:
          - {$ref: "#/$defs/common/games"}
          - properties:
              minecraft:
                required: [title, version, url, sha256, settings, java, eula, admins]
                properties:
                  java: {required: [version, url, sha256]}
              terraria: {required: [title, version, url, sha256, settings]}
              factorio: {required: [title, version, url, sha256, settings, space_age, admins]}
      power:
        type: object
        propertyNames: {$ref: "#/$defs/name"}
        additionalProperties:
          allOf: [{$ref: "#/$defs/power"}, {required: [title, run, stop, idle_minutes]}]
      proxy:
        allOf:
          - {$ref: "#/$defs/common/proxy"}
          - required: [allow]
