# JSON Schema (draft 2020-12) for NullBill data.
#   $defs.config: $NULLBILL_HOME/config.yaml as the owner writes it.
#   $defs.model:  catalog.yaml merged with config.yaml; plan reads this.
# A service, zone, role or person added in config.yaml must be complete
# after the merge, so the model schema is the strict one.
$schema: https://json-schema.org/draft/2020-12/schema

$defs:
  name:
    type: string
    pattern: "^[a-z][a-z0-9-]{0,30}$"

  # A local model's name, as clients of the model gateway ask for it.
  model_name:
    type: string
    pattern: "^[a-z][a-z0-9.-]{0,40}$"

  ref:
    # zone:<name>, service:<name>, role:<name>; zone:* means every zone;
    # host is the PVE host itself.
    type: string
    pattern: "^(zone:(\\*|[a-z][a-z0-9-]*)|service:[a-z][a-z0-9-]*|role:[a-z][a-z0-9-]*|host)$"

  size:
    type: object
    additionalProperties: false
    properties:
      cores: {type: integer, minimum: 1}
      memory_mib: {type: integer, minimum: 128}
      disk_gib: {type: integer, minimum: 1}

  port:
    type: object
    additionalProperties: false
    required: [port, proto, from]
    properties:
      port: {type: integer, minimum: 1, maximum: 65535}
      proto: {enum: [tcp, udp]}
      from: {type: array, minItems: 1, items: {$ref: "#/$defs/ref"}}

  zone:
    type: object
    additionalProperties: false
    properties:
      index: {type: integer, minimum: 1, maximum: 254}
      description: {type: string}
      # direct: internet through the router; proxy: only via egress-proxy;
      # none: no internet. Omitted means none.
      egress: {enum: [direct, proxy, none]}

  role:
    type: object
    additionalProperties: false
    properties:
      description: {type: string}
      reach: {type: array, items: {$ref: "#/$defs/ref"}}

  person:
    type: object
    additionalProperties: false
    required: [role, login]
    properties:
      role: {$ref: "#/$defs/name"}
      # The person's Tailscale login, e.g. dev-b@example.internal.
      login: {type: string, pattern: "^[^@\\s]+@[^@\\s]+$"}

  service:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      # Host part of the service address, so below the pool range at .128.
      id: {type: integer, minimum: 1, maximum: 127}
      kind: {enum: [lxc, vm, vm-pool]}
      zone: {$ref: "#/$defs/name"}
      workload: {$ref: "#/$defs/name"}
      description: {type: string}
      attach: {const: all-zones}
      # In the pool the agent's PVE token may power-manage and snapshot,
      # and reachable by SSH from the operator. Never in mgmt or access.
      agent_managed: {type: boolean}
      # Made by install.sh, not OpenTofu: the nullbill container itself,
      # which runs apply (docs/adr/0006-nullbill-on-the-server.md).
      installed: {type: boolean}
      # The cloud image a Linux VM boots; debian-cloud when omitted.
      image: {enum: [debian-cloud, debian-13-cloud]}
      # Names egress-proxy forwards for this guest only, on top of
      # proxy.allow. Only for fixed-address guests in egress: proxy zones.
      proxy_allow: {type: array, uniqueItems: true, items: {$ref: "#/$defs/domain_pattern"}}
      gpu: {type: boolean}
      # Set when NullBill does not put the program behind ports in place:
      # who does, or why nothing does yet. verify reports a flow to such a
      # port that finds nothing listening as DEGRADED with this text.
      listener: {type: string, minLength: 1}
      floor: {$ref: "#/$defs/size"}
      grow: {type: integer, minimum: 1}
      # vm-pool: the labels a CI job names in runs-on to land on this pool.
      runs_on: {type: array, minItems: 1, uniqueItems: true, items: {$ref: "#/$defs/name"}}
      ports: {type: array, items: {$ref: "#/$defs/port"}}

  gpu_pin:
    type: object
    additionalProperties: false
    properties:
      # host-shared, or vm:<service> to pass the whole GPU to one VM.
      owner: {type: string, pattern: "^(host-shared|vm:[a-z][a-z0-9-]*)$"}
      # Answer for GPUs whose VRAM the probe cannot read.
      vram_mib: {type: integer, minimum: 1}
      # VRAM budget per consuming service, host-shared GPUs only.
      consumers:
        type: object
        additionalProperties: {type: integer, minimum: 1}

  disk_pin:
    type: object
    additionalProperties: false
    required: [use]
    properties:
      # legacy: keep the data, mount it on the host and share it to the
      # owner (docs/adr/0007-legacy-disks.md). Never chosen by default.
      # storage: an LVM-thin PVE storage of its own; guests stay where the
      # plan puts them. Never chosen by default.
      use: {enum: [pbs, ignore, legacy, storage]}
      # Required to let apply format a disk that carries signatures.
      wipe: {type: boolean}
      # legacy only. ro (default) or rw; rw only on NTFS that checks clean.
      mode: {enum: [ro, rw]}
      # legacy only. Partition numbers to keep; default every partition
      # with NTFS, exFAT or FAT.
      partitions: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 1}}
      # legacy only. false mounts it on the host without sharing it.
      share: {type: boolean}
      # legacy only. Share and mount name; default from the partition label.
      name: {$ref: "#/$defs/name"}
      # Converting a kept (legacy) disk, with wipe: true, takes one of these.
      # evacuate: a PVE storage that receives a verified copy of its files,
      # shared from the files guest from then on.
      evacuate: {type: string, pattern: "^[a-zA-Z][a-zA-Z0-9_.-]{0,63}$"}
      # discard_data: the owner has the files elsewhere; they are lost.
      discard_data: {const: true}
      # storage only. The PVE storage and volume group name; default nb-data.
      storage: {type: string, pattern: "^nb-[a-z][a-z0-9-]{0,30}$"}

  override:
    type: object
    additionalProperties: false
    properties:
      cores: {type: integer, minimum: 1}
      memory_mib: {type: integer, minimum: 128}
      disk_gib: {type: integer, minimum: 1}
      count: {type: integer, minimum: 1}

  common:
    network:
      type: object
      additionalProperties: false
      properties:
        base: {type: string, pattern: "^10\\.[0-9]{1,3}\\.0\\.0/16$"}
        domain: {type: string, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"}
        vmid_base: {type: integer, minimum: 100, maximum: 999000}
    host:
      type: object
      additionalProperties: false
      properties:
        reserve: {$ref: "#/$defs/size"}
        # The reserve on hosts with less memory than below_mib.
        reserve_small:
          type: object
          additionalProperties: false
          properties:
            memory_mib: {type: integer, minimum: 1024}
            below_mib: {type: integer, minimum: 1024}
        # Percent of a container's memory limit the plan counts as used.
        container_share_pct: {type: integer, minimum: 10, maximum: 100}
        console:
          type: object
          additionalProperties: false
          properties:
            enabled: {type: boolean}
            memory_mib: {type: integer, minimum: 256}
        # Ports on the PVE host itself. Role sources arrive through the VPN.
        ports: {type: array, items: {$ref: "#/$defs/port"}}
    zones: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/zone"}}
    roles: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/role"}}
    services: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/service"}}
    people: {type: object, propertyNames: {$ref: "#/$defs/name"}, additionalProperties: {$ref: "#/$defs/person"}}
    engines:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [min_gpus, engine]
        properties:
          min_gpus: {type: integer, minimum: 1}
          max_gpus: {type: integer, minimum: 1}
          engine: {enum: [llama.cpp]}
    models: {type: object, propertyNames: {$ref: "#/$defs/model_name"}, additionalProperties: {$ref: "#/$defs/llm"}}
    tailnet:
      type: object
      additionalProperties: false
      properties:
        free_limits:
          type: object
          additionalProperties: false
          properties:
            users: {type: integer, minimum: 1}
            groups: {type: integer, minimum: 1}
            tagged_devices: {type: integer, minimum: 1}
    verify:
      type: object
      additionalProperties: false
      properties:
        public_name: {$ref: "#/$defs/domain_pattern"}
    updates:
      type: object
      additionalProperties: false
      properties:
        # Local time, HH:MM, when a guest whose update needs a reboot reboots.
        reboot_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
    images:
      type: object
      additionalProperties: false
      properties:
        debian-lxc: {$ref: "#/$defs/image"}
        debian-cloud: {$ref: "#/$defs/image"}
        debian-13-cloud: {$ref: "#/$defs/image"}
    proxy:
      type: object
      additionalProperties: false
      properties:
        allow: {type: array, uniqueItems: true, items: {$ref: "#/$defs/domain_pattern"}}

  # A local model llama.cpp serves (catalog.yaml's models).
  llm:
    type: object
    additionalProperties: false
    properties:
      url: {type: string, pattern: "^https://"}
      sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      size_mib: {type: integer, minimum: 1}
      vram_mib: {type: integer, minimum: 1}
      context: {type: integer, minimum: 512}

  image:
    type: object
    additionalProperties: false
    required: [url, sha512]
    properties:
      url: {type: string, pattern: "^https?://"}
      sha512: {type: string, pattern: "^[0-9a-f]{128}$"}

  domain_pattern:
    # A host name; a leading dot also matches its subdomains.
    type: string
    pattern: "^\\.?[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  config:
    type: object
    additionalProperties: false
    properties:
      target:
        type: object
        additionalProperties: false
        required: [ssh]
        properties:
          # ssh destination of the PVE host, e.g. root@pve.internal
          ssh: {type: string, minLength: 1}
      intent:
        type: object
        additionalProperties: false
        properties:
          workloads:
            type: array
            uniqueItems: true
            items: {$ref: "#/$defs/name"}
      network: {$ref: "#/$defs/common/network"}
      host: {$ref: "#/$defs/common/host"}
      zones: {$ref: "#/$defs/common/zones"}
      roles: {$ref: "#/$defs/common/roles"}
      services: {$ref: "#/$defs/common/services"}
      people: {$ref: "#/$defs/common/people"}
      proxy: {$ref: "#/$defs/common/proxy"}
      updates: {$ref: "#/$defs/common/updates"}
      images: {$ref: "#/$defs/common/images"}
      verify: {$ref: "#/$defs/common/verify"}
      models: {$ref: "#/$defs/common/models"}
      gpus:
        # Keyed by PCI address as the probe reports it.
        type: object
        # Quote them: YAML 1.1 reads an unquoted 0000:01:00.0 as a number.
        propertyNames: {type: string, pattern: "^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\\.[0-7]$"}
        additionalProperties: {$ref: "#/$defs/gpu_pin"}
      disks:
        # Keyed by the disk id the probe reports.
        type: object
        additionalProperties: {$ref: "#/$defs/disk_pin"}
      overrides:
        type: object
        propertyNames: {$ref: "#/$defs/name"}
        additionalProperties: {$ref: "#/$defs/override"}
      inference:
        type: object
        additionalProperties: false
        properties:
          engine: {enum: [llama.cpp]}
          # A name from models.
          model: {$ref: "#/$defs/model_name"}

  model:
    type: object
    required: [network, host, zones, roles, services, people, engines, models, proxy, tailnet, images, verify, updates]
    properties:
      network: {$ref: "#/$defs/common/network", required: [base, domain, vmid_base]}
      host:
        allOf:
          - {$ref: "#/$defs/common/host"}
          - required: [reserve]
            properties:
              reserve: {required: [cores, memory_mib]}
      zones:
        type: object
        additionalProperties:
          allOf: [{$ref: "#/$defs/zone"}, {required: [index]}]
      roles:
        type: object
        additionalProperties:
          allOf: [{$ref: "#/$defs/role"}, {required: [reach]}]
      services:
        type: object
        additionalProperties:
          allOf:
            - {$ref: "#/$defs/service"}
            - required: [id, kind, zone, workload, floor]
              properties:
                floor: {required: [cores, memory_mib, disk_gib]}
      people: {$ref: "#/$defs/common/people"}
      engines: {$ref: "#/$defs/common/engines"}
      models:
        type: object
        propertyNames: {$ref: "#/$defs/model_name"}
        additionalProperties:
          allOf: [{$ref: "#/$defs/llm"}, {required: [url, sha256, size_mib, vram_mib, context]}]
      proxy:
        allOf:
          - {$ref: "#/$defs/common/proxy"}
          - required: [allow]
