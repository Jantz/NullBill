# Platform defaults. config.yaml in $NULLBILL_HOME merges over this file by
# name, so any value here can be pinned there.
#
# Sizes below are starting floors chosen for this project, not measurements.
# They must fit the small class (4 threads, 16 GiB, no GPU) together with the
# host reserve; tests/test_plan.py enforces that.

network:
  # Each zone takes the /24 at its index inside this /16. In every zone the
  # router is .1, a service is .<its id>, pool clones draw from .128/26 and
  # the PVE host is .254 on mgmt.
  base: 10.42.0.0/16
  # Names resolve as <service>.<domain>; .internal is reserved for private use.
  domain: nullbill.internal
  # A guest's VMID is vmid_base + its service id.
  vmid_base: 2000

host:
  reserve:
    cores: 1
    memory_mib: 4096
  # PVE without ZFS runs in under 2 GiB; a 16 GiB host cannot spare 4.
  reserve_small:
    memory_mib: 3072
    below_mib: 24576
  # A container's memory is a limit it may grow to, taken only as it is used;
  # a VM holds all of its own. The plan counts each container at this many
  # percent of its limit against the host's memory, so idle services do not
  # crowd out VMs. A policy choice, not a measurement: the host's swap and
  # the MemoryHigh alert cover the case where they all fill up at once.
  container_share_pct: 50
  # The on-site screen (ansible/roles/console): a kiosk browser on the host's
  # monitor showing the NullBill page. Off by default; it costs the host
  # about memory_mib.
  console:
    enabled: false
    memory_mib: 512
  # The operator holds the agent's API token, so it reaches the API only.
  ports:
    # The runner dispatcher's token may only clone runners (ci.py).
    - {port: 8006, proto: tcp, from: ["role:owner", "service:nullbill", "service:operator", "service:runner-dispatcher"]}
    # The operator: the runtime agent's root key, while the owner's switch
    # on the page puts it in authorized_keys (nullbill/hostroot.py).
    - {port: 22, proto: tcp, from: ["role:owner", "service:nullbill", "service:operator"]}
    - {port: 9100, proto: tcp, from: ["service:monitoring"]}

zones:
  mgmt:
    index: 1
    description: Owner-only management guests.
    egress: proxy
  services:
    index: 2
    description: Shared platform services.
    egress: direct
  build:
    index: 3
    description: CI clones and the credential-free workspace.
    egress: proxy
  inference:
    index: 4
    description: Model serving and the model gateway.
    egress: proxy
  windows:
    index: 5
    description: Windows runner clones and the RDP dev VM.
    egress: proxy
  access:
    index: 6
    description: VPN entry. The only way into the other zones.
    egress: direct
  media:
    index: 7
    description: The media server, alone, with the kept disks read-only.
    egress: proxy
  games:
    index: 8
    description: Game servers, one container each, for the people the owner lets in.
    egress: proxy

roles:
  owner:
    description: Reaches every zone, including mgmt.
    reach: ["zone:*"]
  default:
    description: Git/CI and the credential-free workspace only.
    reach: ["service:forgejo", "service:workspace"]
  # The role the page gives a person the owner adds (Access, People). It
  # reaches nothing by itself: each person gets the services ticked for
  # them (people.<name>.services), on the ports that list `shared`.
  friend:
    description: Nothing but the services the owner picks for that person.
    reach: []

# agent_managed: in the PVE pool the agent may power-manage and snapshot,
# and open to SSH from the operator with a short-lived certificate. Guests
# that hold credentials (dispatcher, gateway) or the owner's desktop stay out.
# id: unique per service; sets the VMID and the host part of the address.
# workload: core services are always planned. Others are planned only when
# intent.workloads lists their workload.
# ports.from: who may open the port. A role is everyone who holds it;
# `shared` is each person the owner gave this service to (Access, People on
# the page). Only a port that lists `shared` can be given to anyone, and
# none in mgmt can, so an admin port stays the owner's by leaving it out.
services:
  router:
    id: 1
    kind: vm
    zone: mgmt
    workload: core
    attach: all-zones
    floor: {cores: 1, memory_mib: 512, disk_gib: 4}
    ports:
      - {port: 53, proto: udp, from: ["zone:*"]}
      - {port: 53, proto: tcp, from: ["zone:*"]}
      # apply reaches VMs over SSH through the host (ProxyJump).
      - {port: 22, proto: tcp, from: ["host", "role:owner"]}
  nullbill:
    id: 2
    kind: lxc
    zone: mgmt
    workload: core
    installed: true
    description: NullBill itself, made by install.sh. The setup and status page, apply, its state and secrets. Owner only.
    # What apply fetches: OpenTofu's provider registry and Ansible Galaxy.
    proxy_allow: [registry.opentofu.org, galaxy.ansible.com]
    floor: {cores: 1, memory_mib: 768, disk_gib: 8}
    ports:
      # host: the on-site screen's browser runs there. operator: the
      # runtime agent starts verify and reads its output (web/server.py).
      - {port: 8443, proto: tcp, from: ["role:owner", "host", "service:operator"]}
  egress-proxy:
    id: 10
    kind: lxc
    zone: services
    workload: core
    floor: {cores: 1, memory_mib: 512, disk_gib: 4}
    ports:
      - {port: 3128, proto: tcp, from: ["zone:mgmt", "zone:build", "zone:inference", "zone:windows", "zone:media", "zone:games"]}
  vpn:
    id: 11
    kind: lxc
    zone: access
    workload: core
    floor: {cores: 1, memory_mib: 256, disk_gib: 2}
  step-ca:
    id: 12
    kind: lxc
    zone: mgmt
    workload: core
    floor: {cores: 1, memory_mib: 256, disk_gib: 2}
    ports:
      - {port: 443, proto: tcp, from: ["zone:*"]}
  postgres:
    id: 13
    kind: lxc
    zone: services
    workload: core
    floor: {cores: 1, memory_mib: 1024, disk_gib: 16}
    ports:
      - {port: 5432, proto: tcp, from: ["service:forgejo"]}
  monitoring:
    id: 14
    kind: lxc
    zone: mgmt
    workload: core
    description: Prometheus, Alertmanager, Grafana and Loki. Sends alerts to the owner's ntfy topic and pings Healthchecks.io.
    # Grafana's apt repository, and where alerts go (ansible/roles/monitoring).
    proxy_allow: [apt.grafana.com, ntfy.sh, hc-ping.com]
    floor: {cores: 1, memory_mib: 1536, disk_gib: 32}
    ports:
      - {port: 3000, proto: tcp, from: ["role:owner"]}
      - {port: 3100, proto: tcp, from: ["zone:*"]}
      # The operator's agent, and the status view on the NullBill page.
      - {port: 9090, proto: tcp, from: ["service:operator", "service:nullbill"]}
  pbs:
    id: 15
    kind: vm
    zone: mgmt
    workload: core
    description: Proxmox Backup Server on its own disk. The host sends encrypted backups.
    image: debian-13-cloud
    floor: {cores: 1, memory_mib: 2048, disk_gib: 8}
    ports:
      - {port: 8007, proto: tcp, from: ["host", "role:owner"]}
      - {port: 22, proto: tcp, from: ["host"]}
  operator:
    id: 16
    kind: lxc
    zone: mgmt
    workload: core
    description: Holds the agent CLI and token. Owner only. Reaches the PVE API and SSH, CA, Loki, Prometheus, the page and SSH on agent-managed guests.
    # The agent CLI's model API (docs/adr/0002-agent-cli.md), for this guest only.
    proxy_allow: [api.anthropic.com]
    floor: {cores: 1, memory_mib: 512, disk_gib: 8}
  forgejo:
    id: 17
    kind: lxc
    zone: services
    workload: core
    floor: {cores: 1, memory_mib: 1024, disk_gib: 32}
    # No sign-up: a person given Forgejo still needs a user the owner makes.
    share:
      title: Forgejo
      what: Git repositories and CI
      open: "https://{host}/"
      note: I make your account and send you its sign-in. Git over SSH is git@{host}.
    ports:
      # monitoring: blackbox watches the certificate renew.
      - {port: 443, proto: tcp, from: ["role:owner", "role:default", "shared", "zone:build", "zone:windows", "service:runner-dispatcher", "service:monitoring"]}
      - {port: 22, proto: tcp, from: ["role:owner", "role:default", "shared"]}
  runner-dispatcher:
    id: 18
    kind: lxc
    zone: services
    workload: linux-ci
    description: Clones a golden VM per job. Lives outside build.
    floor: {cores: 1, memory_mib: 256, disk_gib: 4}
    ports:
      # Each clone fetches its one-time runner registration here at boot.
      - {port: 8443, proto: tcp, from: ["zone:build", "service:monitoring"]}
  files:
    id: 23
    kind: lxc
    # mgmt: owner-only, and out to the internet only through the proxy.
    zone: mgmt
    # Planned by itself once a disk is kept and shared (disks.<id>.use:
    # legacy); never listed in intent.workloads.
    workload: files
    description: Shares disks kept from a previous OS to the owner over SMB. Holds the owner's files, so never agent-managed. Not backed up.
    floor: {cores: 1, memory_mib: 512, disk_gib: 4}
    ports:
      - {port: 445, proto: tcp, from: ["role:owner"]}
  jellyfin:
    id: 24
    kind: lxc
    zone: media
    workload: media
    description: Jellyfin, which plays the files on the disks kept from a previous OS (read-only) to the owner's devices. Not agent-managed.
    # Jellyfin's apt repository and plugin catalogue, and where it looks up
    # titles, posters and album details (docs/adr/0009-media-server.md).
    # repo.jellyfin.org answers each package with a redirect to one of its
    # mirrors (nyc1.mirror.jellyfin.org and the like); without them apt
    # retries the refused mirrors for half an hour.
    proxy_allow:
      - repo.jellyfin.org
      - .mirror.jellyfin.org
      - api.themoviedb.org
      - image.tmdb.org
      - musicbrainz.org
      - coverartarchive.org
      - .archive.org
    # Transcoding takes the cores; the library's index and artwork the disk.
    floor: {cores: 2, memory_mib: 2048, disk_gib: 16}
    share:
      title: Jellyfin
      what: Films, series and music
      open: "http://{host}:8096/"
      note: I make your account and send you its sign-in. Jellyfin's apps for phones and TVs take the same address.
    ports:
      - {port: 8096, proto: tcp, from: ["role:owner", "shared"]}
  # Game servers (the games table below, docs/adr/0012-game-servers.md).
  # Each has one port for its players and no other. Memory is the server's
  # with a small world and a few players, a choice, not a measurement:
  # raise it with overrides.<name>.memory_mib when the world grows.
  minecraft:
    id: 25
    kind: lxc
    zone: games
    workload: minecraft
    description: Minecraft Java Edition server. Not agent-managed.
    # The server file, and Mojang's services: the server asks them whether
    # each player who joins is signed in to the account they claim.
    proxy_allow:
      - piston-data.mojang.com
      - discovery.minecraftservices.com
      - api.minecraftservices.com
      - sessionserver.mojang.com
      - api.mojang.com
    # Java's heap is memory_mib less 1024 for the JVM itself and the system.
    floor: {cores: 2, memory_mib: 3072, disk_gib: 16}
    share:
      title: Minecraft
      what: A Minecraft world to play in together
      open: "{host}:{port}"
      note: "You need Minecraft: Java Edition {version}. Choose Multiplayer, Add Server, and type this as the server address."
    ports:
      - {port: 25565, proto: tcp, from: ["role:owner", "shared"]}
  terraria:
    id: 26
    kind: lxc
    zone: games
    workload: terraria
    description: Terraria dedicated server. Not agent-managed.
    proxy_allow: [terraria.org]
    floor: {cores: 1, memory_mib: 1536, disk_gib: 4}
    share:
      title: Terraria
      what: A Terraria world to play in together
      note: You need Terraria {version} on a computer. Choose Multiplayer, Join via IP, type this address, then the port.
    ports:
      - {port: 7777, proto: tcp, from: ["role:owner", "shared"]}
  factorio:
    id: 27
    kind: lxc
    zone: games
    workload: factorio
    description: Factorio headless server. Not agent-managed.
    # The server file (factorio.com sends on to dl.factorio.com), and
    # Factorio's sign-in service, which the server asks about each player.
    proxy_allow: [factorio.com, dl.factorio.com, auth.factorio.com]
    floor: {cores: 1, memory_mib: 1536, disk_gib: 8}
    share:
      title: Factorio
      what: A Factorio factory to build together
      open: "{host}:{port}"
      note: You need Factorio {version}, signed in to your factorio.com account. Choose Multiplayer, Connect to address, and type this.
    ports:
      - {port: 34197, proto: udp, from: ["role:owner", "shared"]}
  linux-runner:
    id: 30
    kind: vm-pool
    zone: build
    workload: linux-ci
    agent_managed: true
    description: One golden-VM clone per CI job.
    runs_on: [linux]
    floor: {cores: 2, memory_mib: 2048, disk_gib: 32}
    ports:
      # apply bakes the golden image over SSH through the host.
      - {port: 22, proto: tcp, from: ["host"]}
    grow: 2
  workspace:
    id: 19
    kind: lxc
    zone: build
    workload: agents
    agent_managed: true
    description: Credential-free workspace for coding agents.
    floor: {cores: 1, memory_mib: 1024, disk_gib: 32}
    ports:
      - {port: 22, proto: tcp, from: ["role:default", "role:owner"]}
  inference:
    id: 20
    kind: lxc
    zone: inference
    workload: inference
    agent_managed: true
    gpu: true
    # The model lives in the GPU's VRAM (gpus.<pci>.consumers budgets it);
    # memory holds the server, the Vulkan driver's host buffers, the part
    # of the model llama.cpp keeps on the CPU, and the recurrent state it
    # saves for each context checkpoint (150 MiB each for bonsai-2-27b).
    # With llama.cpp's default of 32 checkpoints and its prompt cache, the
    # kernel killed llama-server mid-conversation; the inference role allows
    # 2 checkpoints and no prompt cache, which keeps it well inside this.
    floor: {cores: 2, memory_mib: 2048, disk_gib: 64}
    # NVIDIA's driver, whose user-space half must match the host's
    # (ansible/roles/inference).
    proxy_allow: [download.nvidia.com]
    ports:
      - {port: 8080, proto: tcp, from: ["service:model-gateway"]}
  model-gateway:
    id: 21
    kind: lxc
    zone: inference
    workload: inference
    description: LiteLLM, one OpenAI-compatible API in front of the local model.
    # LiteLLM alone holds about 330 MiB; with nginx, the certificate renewer
    # and the hourly apt jobs a 512 MiB container sat full and stopped
    # answering.
    floor: {cores: 1, memory_mib: 1024, disk_gib: 4}
    # By address: that is where the gateway shows the certificate devices
    # trust (browserca.py).
    share:
      title: Local AI model
      what: An OpenAI-compatible API in front of the model on the graphics card
      open: "https://{ip}:4000/v1"
      note: It asks for an API key, which I send you. Ask for the model as local.
    ports:
      - {port: 4000, proto: tcp, from: ["zone:build", "role:owner", "shared", "service:monitoring"]}
  windows-runner:
    id: 31
    kind: vm-pool
    zone: windows
    workload: windows-ci
    agent_managed: true
    floor: {cores: 2, memory_mib: 4096, disk_gib: 64}
    grow: 1
  windows-dev:
    id: 22
    kind: vm
    zone: windows
    workload: windows-dev
    description: RDP dev VM.
    listener: you install Windows and turn on Remote Desktop (docs/runbooks/windows-desktop.md)
    floor: {cores: 2, memory_mib: 4096, disk_gib: 96}
    ports:
      - {port: 3389, proto: tcp, from: ["role:owner"]}

# Inference engine by the number of host-shared GPUs given to inference.
# llama.cpp serves quantised models and splits one across several cards by
# layer. vLLM, whose tensor parallelism suits several cards better, is not
# built yet. Pin with inference.engine.
engines:
  - {min_gpus: 1, engine: llama.cpp}

# Local models llama.cpp may serve: GGUF files on Hugging Face, pinned to
# a repository commit and by SHA-256 (both from the Hub's API, such as
# https://huggingface.co/api/models/unsloth/Qwen3.5-9B-GGUF/tree/main).
# plan picks the one with the largest vram_mib that fits the VRAM given to
# inference; pin another with inference.model. vram_mib is the file plus
# room for `context` tokens of cache: a choice, not a measurement.
# sampling is the model card's own advice, the server's default for a
# request that sets none: without it llama.cpp samples every model alike
# (no presence penalty, top_k 40), which made Qwen3.5 repeat itself.
# reasoning: on, off, or auto (the chat template decides); reasoning_effort
# goes to templates that take one. cache_type q8_0 halves the context's
# cache (with flash attention), for context a 12 GB card could not hold.
models:
  qwen3.5-4b:
    url: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/e87f176479d0855a907a41277aca2f8ee7a09523/Qwen3.5-4B-Q4_K_M.gguf
    sha256: 00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4
    size_mib: 2613
    vram_mib: 4096
    context: 32768
    # Unsloth's template answers without thinking unless asked; Qwen's own
    # default is to think, with these settings.
    reasoning: "on"
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0}
  qwen3.5-9b:
    url: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-Q4_K_M.gguf
    sha256: 03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
    size_mib: 5417
    vram_mib: 8192
    context: 32768
    # Unsloth's template answers without thinking unless asked; Qwen's own
    # default is to think, with these settings.
    reasoning: "on"
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5, repeat_penalty: 1.0}
  # Qwen3.8-27B in ternary weights (Prism ML), in llama.cpp's own Q2_0
  # packing, which stock llama.cpp runs from b11556: a 27B model in 7.1 GiB,
  # close to the full model in Prism ML's benchmarks, which is well ahead
  # of Qwen3.5-9B in Qwen's. It thinks by default; its card advises medium
  # effort, since the default thinks far longer and loops on some prompts.
  # 64k of context in a q8_0 cache fits it in 10 GiB of a card.
  bonsai-2-27b:
    url: https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/839bd57023c1558945afea70a74fa83c054f35f9/Ternary-Bonsai-2-27B-Q2_0.gguf
    sha256: 4f99aed01b8a877e153f9aa6569a4440fe17c59701cc0953e36d7f460549e70e
    size_mib: 7272
    vram_mib: 10240
    context: 65536
    cache_type: q8_0
    reasoning: auto
    reasoning_effort: medium
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05, presence_penalty: 0.0, repeat_penalty: 1.0}
  qwen3.6-27b:
    url: https://huggingface.co/unsloth/Qwen3.6-27B-GGUF/resolve/82d411acf4a06cfb8d9b073a5211bf410bfc29bf/Qwen3.6-27B-Q4_K_M.gguf
    sha256: 5ed60d0af4650a854b1755bd392f9aef4872643dc25a254bc68043fa638392a0
    size_mib: 16038
    vram_mib: 20480
    context: 32768
    reasoning: "on"
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0, repeat_penalty: 1.0}

# Game servers. Each entry is the service of the same name above, alone in
# its container in the games zone, and has a role in ansible/roles
# (game_<name>). The server is the vendor's own download, pinned by SHA-256.
# Players' games must be the same version as the server: when a game
# updates, this pin moves, or pin the new file in config.yaml under
# games.<name> (version, url, sha256). settings are the server's own
# options by its own names, on top of what NullBill sets; admins are player
# names. tools/game-pins prints what the vendors offer now.
games:
  minecraft:
    title: Minecraft
    # The release Mojang's list names as latest:
    # https://piston-meta.mojang.com/mc/game/version_manifest_v2.json, whose
    # 26.3.json gives this file with SHA-1
    # 33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c.
    version: "26.3"
    url: https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar
    sha256: d052f14d7a173734fba553711e5b570162e2f2a313267ee31a21b975a679be64
    # 26.3 needs Java 25 (javaVersion in 26.3.json); Debian 12 has 17.
    # Eclipse Temurin's JRE, with its checksum, from
    # https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jre&os=linux&vendor=eclipse
    java:
      version: 25.0.5+8
      url: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jre_x64_linux_hotspot_25.0.5_8.tar.gz
      sha256: 6fac98f0c8202efc3135a9e9e42aa61963ec42d1c5cbb40caf231e7b14a24ef6
    # The server starts only once its owner agrees to Minecraft's EULA
    # (https://aka.ms/MinecraftEULA): eula: true in config.yaml says so.
    eula: false
    admins: []
    settings: {}
  terraria:
    title: Terraria
    # The file https://terraria.org/api/get/dedicated-servers-names lists
    # first. Re-Logic publishes no checksum; this is the download's.
    version: 1.4.5.8
    url: https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip
    sha256: f513a4ac9789d34af766291ae217c9cd7d9472e13782a0e2b17512f70d7a8334
    settings: {}
  factorio:
    title: Factorio
    # The stable headless release in https://factorio.com/api/latest-releases,
    # with its checksum from https://factorio.com/download/sha256sums/.
    version: 2.1.24
    url: https://factorio.com/get-download/2.1.24/headless/linux64
    sha256: c49b66cff90aceff87b30f2973af0df7f51712cb2ee3153e0169d9bed46a964f
    # false: the base game, which everyone who owns Factorio can join.
    # true: the Space Age expansion, which every player must own. Decided
    # when the map is made.
    space_age: false
    admins: []
    settings: {}

# Domains egress-proxy forwards to, for zones with egress: proxy. A leading
# dot also matches subdomains. Only HTTPS CONNECT and plain HTTP to these
# names pass; addresses typed as IPs and private ranges never do. A list in
# config.yaml replaces this one, so copy it there before adding to it.
proxy:
  allow:
    - .debian.org           # deb.debian.org, security.debian.org
    - .proxmox.com          # download.proxmox.com for PBS
    # Smallstep's apt repository for step-ca and step-cli, which every guest
    # with a certificate installs (ansible/roles/step_ca, tls_cert). It
    # answers with a redirect to pkgs.infra.smallstep.com.
    - packages.smallstep.com
    - pkgs.infra.smallstep.com
    - .ubuntu.com
    - .pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    - .crates.io
    - proxy.golang.org
    - sum.golang.org
    - .github.com
    - code.forgejo.org      # Forgejo Runner releases
    - data.forgejo.org      # Forgejo Actions' default action mirror
    - .githubusercontent.com
    - .docker.io
    - production.cloudflare.docker.com
    - ghcr.io
    - .huggingface.co
    - .hf.co
    - .windowsupdate.com
    - .update.microsoft.com
    - .delivery.mp.microsoft.com

# Images apply downloads onto the media storage. Pinned by checksum, so a
# changed file fails the download instead of booting.
images:
  # From http://download.proxmox.com/images/aplinfo-pve-9.dat
  debian-lxc:
    url: http://download.proxmox.com/images/system/debian-12-standard_12.12-1_amd64.tar.zst
    sha512: 50c85eaaece677a3ebe01cc909b83872e9da2a22c29ae652838afce71e83222fdf40f6accecd7d52b180e912fc1f85ecdf7b3fc4d3027da4d865e509a9e76597
  # From https://cloud.debian.org/images/cloud/bookworm/20261021-2638/SHA512SUMS
  debian-cloud:
    url: https://cloud.debian.org/images/cloud/bookworm/20261021-2638/debian-12-genericcloud-amd64-20261021-2638.qcow2
    sha512: 9f181877006e8d9ca4f4554eba8729a829936f0f7d1db5e77f69b1ef0f6bc372b4d46f3dae39b10d84f9131496c2cc1d449264f26577fe934a79de5a5512a3dd
  # PBS 4 is built for Debian 13; PBS 3 on Debian 12 reached its end of life
  # in 2026-08 (https://pbs.proxmox.com/docs/faq.html).
  # From https://cloud.debian.org/images/cloud/trixie/20261026-2643/SHA512SUMS
  debian-13-cloud:
    url: https://cloud.debian.org/images/cloud/trixie/20261026-2643/debian-13-genericcloud-amd64-20261026-2643.qcow2
    sha512: 3ace18e33bdd036edb49d1f79342bd01d2ab980e35194edb0b410435cd543538d286a0bd13bbb0835f7862306e3d385ce2f6a70d8ecf0bd961111166adbc1b8e

# verify checks direct egress against this name's address, and the proxy
# with both the name and the bare address. It must be on proxy.allow.
verify:
  public_name: deb.debian.org

# Debian security updates install every night on the host and every Linux
# guest (ansible/roles/updates). A guest whose update needs a reboot reboots
# at reboot_time; the host and agent-managed guests wait for the owner.
updates:
  reboot_time: "04:30"

# Limits of Tailscale's free Personal plan, from https://tailscale.com/pricing
# (2026-11-04). plan fails when people and roles would exceed them.
tailnet:
  free_limits: {users: 6, groups: 3, tagged_devices: 50}

# People are listed in config.yaml with their Tailscale login; the catalog
# ships none. The page's Access, People tab adds and removes everyone but
# the owner (people.py).
people: {}
