- name: game group
  ansible.builtin.group:
    name: game
    system: true

- name: game user, without a login
  ansible.builtin.user:
    name: game
    group: game
    system: true
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
    password: "!"

# python3: nb-game. unzip and xz-utils: the servers' archives.
- name: Packages
  ansible.builtin.apt:
    name: [python3, unzip, xz-utils]
    install_recommends: false
    update_cache: true

- name: Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/nullbill
    # Programs that say why this guest is in use, one reason a line.
    - /etc/nullbill/busy.d
    - /var/lib/nullbill
    # node_exporter's textfile collector (the updates role installs it).
    - /var/lib/prometheus/node-exporter

- name: nb-game
  ansible.builtin.copy:
    src: nb-game
    dest: /usr/local/sbin/nb-game
    mode: "0755"

# What stops a guest nobody uses asks every program in busy.d first: while
# one prints a line or fails, the guest stays on.
- name: In use while anyone plays
  ansible.builtin.copy:
    dest: /etc/nullbill/busy.d/game
    mode: "0755"
    content: |
      #!/bin/sh
      # Generated by nullbill. A line while a player is connected or the
      # server does not answer, nothing while it stands empty.
      exec /usr/local/sbin/nb-game busy

- name: Metrics service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nb-game-metrics.service
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Unit]
      Description=NullBill game server metrics
      ConditionPathExists=/etc/nullbill/game.json

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/nb-game metrics

- name: Metrics timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/nb-game-metrics.timer
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Unit]
      Description=NullBill game server metrics, every minute

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

- name: Metrics timer runs
  when: game_server_manage_services | bool
  ansible.builtin.systemd_service:
    name: nb-game-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
