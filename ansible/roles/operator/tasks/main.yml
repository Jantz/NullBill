- name: Debian 12
  ansible.builtin.assert:
    that: ansible_distribution_release == "bookworm"

- name: Secrets from apply are set
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) | length > 0
    fail_msg: "{{ item }} is empty; apply copies it from NULLBILL_HOME"
  loop: [operator_pve_token, operator_pve_ca, operator_ca_root, operator_step_password, operator_anthropic_api_key]

- name: apt through egress-proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80nullbill-proxy
    mode: "0644"
    content: |
      // Generated by nullbill.
      Acquire::http::Proxy "{{ operator_proxy_url }}";
      Acquire::https::Proxy "{{ operator_proxy_url }}";
  when: operator_proxy_url | length > 0

- name: Smallstep repository
  ansible.builtin.include_role:
    name: step_ca
    tasks_from: repo

- name: Tools the agent works with
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - openssh-client
      - "step-cli={{ step_cli_version }}"
    update_cache: true

- name: Agent user, no password and no sudo
  ansible.builtin.user:
    name: "{{ operator_agent_user }}"
    shell: /bin/bash
    password: "!"
    groups: []
    append: false

- name: Agent secrets directory
  ansible.builtin.file:
    path: /etc/nullbill/agent
    state: directory
    owner: root
    group: "{{ operator_agent_user }}"
    mode: "0750"

# Root writes these; the agent user reads them. Paths match
# src/nullbill/agent.py, which verify runs through.
- name: Agent secrets
  ansible.builtin.copy:
    dest: "/etc/nullbill/agent/{{ item.file }}"
    content: "{{ item.value | trim }}\n"
    owner: root
    group: "{{ operator_agent_user }}"
    mode: "0640"
  loop:
    - {file: pve-token, value: "{{ operator_pve_token }}"}
    - {file: pve-root-ca.pem, value: "{{ operator_pve_ca }}"}
    - {file: ca-root.pem, value: "{{ operator_ca_root }}"}
    - {file: step-password, value: "{{ operator_step_password }}"}
    - {file: anthropic-api-key, value: "{{ operator_anthropic_api_key }}"}
  loop_control:
    label: "{{ item.file }}"
  no_log: true

- name: Agent CLI release directory
  ansible.builtin.file:
    path: "/opt/claude-code/{{ operator_claude_code_version }}"
    state: directory
    mode: "0755"

- name: Agent CLI package, checked against its pinned checksum
  ansible.builtin.get_url:
    url: "{{ operator_claude_code_url }}"
    dest: "/opt/claude-code/{{ operator_claude_code_version }}/package.tgz"
    checksum: "sha512:{{ operator_claude_code_sha512 }}"
    mode: "0644"
  environment: "{{ {'https_proxy': operator_proxy_url} if operator_proxy_url else {} }}"

- name: Agent CLI binary
  ansible.builtin.unarchive:
    src: "/opt/claude-code/{{ operator_claude_code_version }}/package.tgz"
    dest: "/opt/claude-code/{{ operator_claude_code_version }}"
    remote_src: true
    include: [package/claude]
    creates: "/opt/claude-code/{{ operator_claude_code_version }}/package/claude"

- name: Agent CLI on PATH
  ansible.builtin.file:
    src: "/opt/claude-code/{{ operator_claude_code_version }}/package/claude"
    dest: /usr/local/bin/claude
    state: link

- name: Tool-call recorder the managed settings run before every tool
  ansible.builtin.copy:
    src: nb-log-tool-use
    dest: /usr/local/sbin/nb-log-tool-use
    mode: "0755"

- name: Managed settings directory
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    mode: "0755"

# Managed settings and instructions outrank anything the agent writes in
# its home directory, and only root can change them.
- name: Agent CLI managed settings and instructions
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/claude-code/{{ item }}"
    mode: "0644"
  loop: [managed-settings.json, CLAUDE.md]

- name: nb-ssh, SSH to agent-managed guests with a short-lived certificate
  ansible.builtin.template:
    src: nb-ssh.j2
    dest: /usr/local/bin/nb-ssh
    mode: "0755"
