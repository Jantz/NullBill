- name: Debian 12
  ansible.builtin.assert:
    that: ansible_distribution_release == "bookworm"

- name: Secrets from apply are set
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) | length > 0
    fail_msg: "{{ item }} is empty; apply copies it from NULLBILL_HOME"
  loop: [operator_pve_token, operator_pve_ca, operator_ca_root, operator_step_password]

- name: One credential for the agent CLI
  ansible.builtin.assert:
    that: (operator_anthropic_api_key | length > 0) != (operator_claude_oauth_token | length > 0)
    fail_msg: set exactly one of operator_anthropic_api_key and operator_claude_oauth_token; apply copies it from NULLBILL_HOME

- name: apt through egress-proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80nullbill-proxy
    mode: "0644"
    content: |
      // Generated by nullbill.
      Acquire::http::Proxy "{{ operator_proxy_url }}";
      Acquire::https::Proxy "{{ operator_proxy_url }}";
  when: operator_proxy_url | length > 0

- name: Smallstep repository
  ansible.builtin.include_role:
    name: step_ca
    tasks_from: repo

- name: Tools the agent works with
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      # NullBill's repository, for fixes the agent proposes as pull requests.
      - gh
      - git
      - jq
      - openssh-client
      - "step-cli={{ step_cli_version }}"
      # Long agent sessions outlive the owner's connection.
      - tmux
    update_cache: true

- name: Agent user, no password and no sudo
  ansible.builtin.user:
    name: "{{ operator_agent_user }}"
    shell: /bin/bash
    password: "!"
    groups: []
    append: false

- name: Agent secrets directory
  ansible.builtin.file:
    path: /etc/nullbill/agent
    state: directory
    owner: root
    group: "{{ operator_agent_user }}"
    mode: "0750"

# Root writes these; the agent user reads them. Paths match
# src/nullbill/agent.py, which verify runs through.
- name: Agent secrets
  ansible.builtin.copy:
    dest: "/etc/nullbill/agent/{{ item.file }}"
    content: "{{ item.value | trim }}\n"
    owner: root
    group: "{{ operator_agent_user }}"
    mode: "0640"
  loop:
    - {file: pve-token, value: "{{ operator_pve_token }}"}
    - {file: pve-root-ca.pem, value: "{{ operator_pve_ca }}"}
    - {file: ca-root.pem, value: "{{ operator_ca_root }}"}
    - {file: step-password, value: "{{ operator_step_password }}"}
    - {file: "{{ operator_credential_file }}", value: "{{ operator_anthropic_api_key or operator_claude_oauth_token }}"}
    - {file: page-token, value: "{{ operator_page_token }}"}
  loop_control:
    label: "{{ item.file }}"
  no_log: true

- name: No credential of the other kind left behind
  ansible.builtin.file:
    path: "/etc/nullbill/agent/{{ 'claude-oauth-token' if operator_anthropic_api_key else 'anthropic-api-key' }}"
    state: absent

- name: Agent CLI release directory
  ansible.builtin.file:
    path: "/opt/claude-code/{{ operator_claude_code_version }}"
    state: directory
    mode: "0755"

- name: Agent CLI package, checked against its pinned checksum
  ansible.builtin.include_role:
    name: downloads
    tasks_from: fetch
  vars:
    downloads_url: "{{ operator_claude_code_url }}"
    downloads_dest: "/opt/claude-code/{{ operator_claude_code_version }}/package.tgz"
    downloads_checksum: "sha512:{{ operator_claude_code_sha512 }}"
    downloads_mode: "0644"
    downloads_proxy: "{{ operator_proxy_url }}"

- name: Agent CLI binary
  ansible.builtin.unarchive:
    src: "/opt/claude-code/{{ operator_claude_code_version }}/package.tgz"
    dest: "/opt/claude-code/{{ operator_claude_code_version }}"
    remote_src: true
    include: [package/claude]
    creates: "/opt/claude-code/{{ operator_claude_code_version }}/package/claude"

# A wrapper, so a subscription token reaches the CLI in its environment.
- name: Agent CLI on PATH
  ansible.builtin.template:
    src: claude.j2
    dest: /usr/local/bin/claude
    mode: "0755"
    follow: false

- name: Tool-call recorder the managed settings run before every tool
  ansible.builtin.copy:
    src: nb-log-tool-use
    dest: /usr/local/sbin/nb-log-tool-use
    mode: "0755"

- name: Managed settings directory
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    mode: "0755"

# Managed settings and instructions outrank anything the agent writes in
# its home directory, and only root can change them.
- name: Agent CLI managed settings and instructions
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/claude-code/{{ item }}"
    mode: "0644"
  loop: [managed-settings.json, CLAUDE.md]

- name: nb-page, verify through the NullBill page
  ansible.builtin.template:
    src: nb-page.j2
    dest: /usr/local/bin/nb-page
    mode: "0755"
  when: operator_page_url | length > 0

- name: nb-ssh, SSH to agent-managed guests with a short-lived certificate
  ansible.builtin.template:
    src: nb-ssh.j2
    dest: /usr/local/bin/nb-ssh
    mode: "0755"

# Root on the PVE host, while the owner's switch on the page allows it
# (src/nullbill/hostroot.py): the page puts this key's public half in the
# host's authorized_keys, from this container's address, every command
# recorded on the host before it runs. The key is the agent's own.
- name: Agent SSH directory
  ansible.builtin.file:
    path: "/home/{{ operator_agent_user }}/.ssh"
    state: directory
    owner: "{{ operator_agent_user }}"
    group: "{{ operator_agent_user }}"
    mode: "0700"

- name: Agent key for the PVE host
  ansible.builtin.command:
    cmd: runuser -u {{ operator_agent_user }} -- ssh-keygen -q -t ed25519 -N '' -C nullbill-agent-root -f /home/{{ operator_agent_user }}/.ssh/nb-host
    creates: "/home/{{ operator_agent_user }}/.ssh/nb-host"

# `ssh pve <command>`: the host's own key pinned, so another machine at its
# address is refused.
- name: The PVE host's key
  ansible.builtin.copy:
    dest: /etc/ssh/ssh_known_hosts
    mode: "0644"
    content: "{{ operator_host_ip }} {{ operator_host_key | trim }}\n"
  when: operator_host_ip | length > 0

- name: ssh pve reaches the host as root with the agent's key
  ansible.builtin.copy:
    dest: /etc/ssh/ssh_config.d/nullbill-host.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      Host pve
        HostName {{ operator_host_ip }}
        User root
        IdentityFile ~/.ssh/nb-host
        IdentitiesOnly yes
        StrictHostKeyChecking yes
        ProxyCommand none
  when: operator_host_ip | length > 0

- name: Git for the agent
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "/home/{{ operator_agent_user }}/.gitconfig"
    owner: "{{ operator_agent_user }}"
    group: "{{ operator_agent_user }}"
    mode: "0644"

- name: GitHub token for NullBill's repository
  ansible.builtin.copy:
    dest: /etc/nullbill/agent/github-token
    content: "{{ operator_github_token | trim }}\n"
    owner: root
    group: "{{ operator_agent_user }}"
    mode: "0640"
  no_log: true
  when: operator_github_token | length > 0

- name: No GitHub token left once the owner removed it
  ansible.builtin.file:
    path: /etc/nullbill/agent/github-token
    state: absent
  when: operator_github_token | length == 0

# The repository's pre-push hook reads $NULLBILL_HOME/denylist.txt, which
# the managed settings point here; only root can change it.
- name: Identifiers of this server that never go to the public repository
  ansible.builtin.copy:
    dest: /etc/nullbill/agent/denylist.txt
    content: |
      # Generated by nullbill from the probe and config; see the operator role.
      {% for entry in operator_denylist %}
      {{ entry }}
      {% endfor %}
    owner: root
    group: "{{ operator_agent_user }}"
    mode: "0640"
  no_log: true

- name: gitleaks release directory
  ansible.builtin.file:
    path: "/opt/gitleaks/{{ operator_gitleaks_version }}"
    state: directory
    mode: "0755"

- name: gitleaks, checked against its pinned checksum
  ansible.builtin.include_role:
    name: downloads
    tasks_from: fetch
  vars:
    downloads_url: "https://github.com/gitleaks/gitleaks/releases/download/v{{ operator_gitleaks_version }}/gitleaks_{{ operator_gitleaks_version }}_linux_x64.tar.gz"
    downloads_dest: "/opt/gitleaks/{{ operator_gitleaks_version }}/gitleaks.tar.gz"
    downloads_checksum: "sha256:{{ operator_gitleaks_sha256 }}"
    downloads_proxy: "{{ operator_proxy_url }}"

- name: gitleaks binary
  ansible.builtin.unarchive:
    src: "/opt/gitleaks/{{ operator_gitleaks_version }}/gitleaks.tar.gz"
    dest: "/opt/gitleaks/{{ operator_gitleaks_version }}"
    remote_src: true
    include: [gitleaks]
    creates: "/opt/gitleaks/{{ operator_gitleaks_version }}/gitleaks"

- name: gitleaks on PATH
  ansible.builtin.file:
    src: "/opt/gitleaks/{{ operator_gitleaks_version }}/gitleaks"
    dest: /usr/local/bin/gitleaks
    state: link
