# The user before the package: its postinst keeps an existing jellyfin
# user, which must be uid 1000 to read the kept disks.
- name: jellyfin group
  ansible.builtin.group:
    name: jellyfin
    gid: "{{ jellyfin_uid }}"

- name: jellyfin user, without a login
  ansible.builtin.user:
    name: jellyfin
    uid: "{{ jellyfin_uid }}"
    group: jellyfin
    home: /var/lib/jellyfin
    create_home: false
    shell: /usr/sbin/nologin
    password: "!"

- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Jellyfin repository key
  ansible.builtin.include_role:
    name: downloads
    tasks_from: fetch
  vars:
    downloads_url: https://repo.jellyfin.org/jellyfin_team.gpg.key
    downloads_dest: /etc/apt/keyrings/jellyfin.asc
    downloads_checksum: "sha256:{{ jellyfin_repo_signer_sha256 }}"
    downloads_mode: "0644"

- name: Jellyfin repository
  register: jellyfin_repo_file
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/jellyfin.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: {{ jellyfin_repo }}
      Suites: bookworm
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/jellyfin.asc

# curl and python3: apply and nullbill verify talk to Jellyfin from inside
# this guest (nb-jellyfin, media.py).
- name: Jellyfin at the pinned versions
  ansible.builtin.apt:
    name:
      - "jellyfin-server={{ jellyfin_version }}"
      - "jellyfin-web={{ jellyfin_version }}"
      - "{{ jellyfin_ffmpeg_package }}={{ jellyfin_ffmpeg_version }}"
      - curl
      - python3
    install_recommends: false
    update_cache: true
  notify: Restart jellyfin

- name: Unit settings
  ansible.builtin.template:
    src: nullbill.conf.j2
    dest: /etc/systemd/system/jellyfin.service.d/nullbill.conf
    mode: "0644"
  notify: Restart jellyfin

- name: nb-jellyfin
  ansible.builtin.copy:
    src: nb-jellyfin
    dest: /usr/local/sbin/nb-jellyfin
    mode: "0755"

- name: Jellyfin runs
  ansible.builtin.systemd_service:
    name: jellyfin
    enabled: true
    state: started
    daemon_reload: true
  when: jellyfin_manage_services | bool
