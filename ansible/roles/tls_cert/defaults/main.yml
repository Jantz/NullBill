# The certificate's name: files are /etc/nullbill/tls/<name>.crt and .key.
tls_cert_name: ""
tls_cert_ca_url: https://step-ca.nullbill.internal
# step-ca's root certificate, PEM. Also written to /etc/nullbill/tls/root_ca.crt
# for clients on this guest.
tls_cert_ca_root: ""
# A one-time token apply makes with `step ca token <name> --san ...` and the
# owner's provisioner. Used only when there is no valid certificate (none
# yet, or one that ran out while the server was off); renewal authenticates
# with the current certificate, so nothing long-lived that can mint
# certificates stays on the guest.
tls_cert_token: ""
# Group that may read the key, e.g. postgres or www-data.
tls_cert_group: root
# Run after each renewal, e.g. "systemctl reload nginx".
tls_cert_reload: ""
tls_cert_manage_services: true
# The step-cli every guest with a certificate runs: the one the step_ca and
# operator roles install, so a guest that has two of these roles is not asked
# for two versions (tools/pins moves the three together).
tls_cert_step_cli_version: 0.31.0-1
