- name: Running kernel
  ansible.builtin.command: uname -r
  register: nvidia_host_kernel
  changed_when: false

# DKMS builds the module for this kernel now and for each kernel the owner
# upgrades to later; proxmox-default-headers follows the default kernel.
- name: Kernel headers and DKMS
  ansible.builtin.apt:
    name: [dkms, build-essential, pkg-config, proxmox-default-headers, "proxmox-headers-{{ nvidia_host_kernel.stdout }}"]
    install_recommends: false
    update_cache: true

- name: Keep nouveau, the kernel's own driver, off the card
  ansible.builtin.copy:
    content: "# Generated by nullbill: the NVIDIA driver drives this card.\nblacklist nouveau\noptions nouveau modeset=0\n"
    dest: /etc/modprobe.d/nb-nouveau.conf
    mode: "0644"
  register: nvidia_host_blacklist

- name: Rebuild the initramfs without nouveau
  ansible.builtin.command: update-initramfs -u -k all
  when: nvidia_host_blacklist.changed
  changed_when: true

- name: Is nouveau loaded
  ansible.builtin.command: grep -c '^nouveau ' /proc/modules
  register: nvidia_host_nouveau
  changed_when: false
  failed_when: false

- name: Unload nouveau
  ansible.builtin.command: modprobe -r nouveau
  register: nvidia_host_unload
  when: nvidia_host_nouveau.rc == 0
  changed_when: nvidia_host_unload.rc == 0
  failed_when: false

- name: Nouveau has let go of the card
  ansible.builtin.assert:
    that: nvidia_host_nouveau.rc != 0 or nvidia_host_unload.rc == 0
    fail_msg: >-
      The kernel's own nouveau driver holds the graphics card and cannot be unloaded while the
      server runs. It is switched off from the next start: restart the server once, then run
      setup again.

- name: Loaded NVIDIA driver
  ansible.builtin.command: cat /sys/module/nvidia/version
  register: nvidia_host_loaded
  changed_when: false
  failed_when: false

- name: Install NVIDIA's driver
  when: nvidia_host_loaded.stdout != nvidia_host_version
  block:
    - name: Download cache
      ansible.builtin.file:
        path: /var/cache/nullbill
        state: directory
        mode: "0755"

    - name: NVIDIA's installer
      ansible.builtin.include_role:
        name: downloads
        tasks_from: fetch
      vars:
        downloads_url: "https://download.nvidia.com/XFree86/Linux-x86_64/{{ nvidia_host_version }}/NVIDIA-Linux-x86_64-{{ nvidia_host_version }}.run"
        downloads_dest: "/var/cache/nullbill/NVIDIA-Linux-x86_64-{{ nvidia_host_version }}.run"
        downloads_checksum: "sha256:{{ nvidia_host_sha256 }}"

    # NVIDIA's open kernel modules, which it recommends from Turing on, built
    # by DKMS. No display parts: the host shows no desktop on this card.
    # apply stops the inference container first, which holds the old module.
    - name: Build and install the driver (takes a few minutes)
      ansible.builtin.command:
        argv:
          - sh
          - "/var/cache/nullbill/NVIDIA-Linux-x86_64-{{ nvidia_host_version }}.run"
          - --silent
          - --no-questions
          - --ui=none
          - --dkms
          - --kernel-module-type=open
          - --no-x-check
          - --no-nouveau-check
          - --no-drm
          - --no-opengl-files
          - --no-wine-files
          - --no-rebuild-initramfs
      changed_when: true

- name: Load the driver at boot
  ansible.builtin.copy:
    content: "# Generated by nullbill.\nnvidia\nnvidia_uvm\n"
    dest: /etc/modules-load.d/nb-nvidia.conf
    mode: "0644"

- name: Load the driver now
  ansible.builtin.command: modprobe {{ item }}
  loop: [nvidia, nvidia_uvm]
  register: nvidia_host_modprobe
  changed_when: false
  failed_when: false

- name: The driver loads
  ansible.builtin.assert:
    that: nvidia_host_modprobe.results | map(attribute='rc') | max == 0
    fail_msg: >-
      The NVIDIA driver did not load: {{ nvidia_host_modprobe.results | map(attribute='stderr') | join(' ') }}.
      With Secure Boot on, the firmware refuses a driver built on the server: turn Secure Boot
      off in the BIOS, or see docs/runbooks/local-models.md.

- name: Device nodes unit
  ansible.builtin.template:
    src: nb-nvidia-devices.service.j2
    dest: /etc/systemd/system/nb-nvidia-devices.service
    mode: "0644"

- name: Make the device nodes now and at every boot
  ansible.builtin.systemd_service:
    name: nb-nvidia-devices
    enabled: true
    state: started
    daemon_reload: true

- name: The card answers
  ansible.builtin.command: nvidia-smi --query-gpu=pci.bus_id,name,driver_version --format=csv,noheader
  register: nvidia_host_smi
  changed_when: false
  failed_when: nvidia_host_version not in nvidia_host_smi.stdout
