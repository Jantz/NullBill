# llama.cpp, built here from source at a pinned release with its Vulkan
# backend: NVIDIA's Vulkan driver runs it on the card, with no CUDA toolkit
# to install (docs/adr/0008-local-models.md). git checks out the tag and
# the role refuses it unless it is still this commit.
inference_llama_repo: https://github.com/ggml-org/llama.cpp.git
inference_llama_tag: b12205
inference_llama_commit: a691b2345844ce1b430201fc5fd404ce062e05f2
# Debian 12's Vulkan headers (1.3.239) are too old for this llama.cpp, so
# it builds against Khronos' headers at the version Debian 13 ships.
inference_vulkan_headers_repo: https://github.com/KhronosGroup/Vulkan-Headers.git
inference_vulkan_headers_tag: v1.4.309
inference_vulkan_headers_commit: 952f776f6573aafbb62ea717d871cd1d6816c387
# Compilers at once. Some files of the Vulkan backend take close to 2 GiB
# each to compile; apply gives the container room for one at a time.
inference_build_jobs: 1

# NVIDIA's user-space driver: the same release as the host's kernel module
# (nvidia_host role), which apply passes. Empty installs none.
inference_nvidia_version: ""
inference_nvidia_sha256: ""

# The model, from catalog.yaml's models; apply passes the planned one.
inference_model_name: ""
inference_model_url: ""
inference_model_sha256: ""
inference_context: 32768
# The model card's settings (catalog.yaml's models): sampling as
# llama-server flags (temperature, top_p, top_k, min_p, presence_penalty,
# repeat_penalty), reasoning on/off/auto, a reasoning effort for templates
# that take one, and the cache's type (q8_0 turns on flash attention,
# which a quantised cache needs).
inference_sampling: {}
inference_reasoning: auto
inference_reasoning_effort: ""
inference_cache_type: f16

inference_listen: 0.0.0.0
inference_port: 8080
# The model gateway's key to this server; apply keeps it in sops.
inference_api_key: ""
# Refuse to finish unless llama.cpp sees a GPU, not only the CPU.
inference_require_gpu: true
# GGML_VK_VISIBLE_DEVICES for the server. llama.cpp skips software Vulkan
# devices unless listed here; the container check lists Mesa's lavapipe.
inference_vulkan_devices: ""
inference_manage_services: true
