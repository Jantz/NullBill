- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Smallstep repository key
  ansible.builtin.get_url:
    url: "{{ step_ca_repo_key_url }}"
    dest: /etc/apt/keyrings/smallstep.asc
    checksum: "sha256:{{ step_ca_repo_signer_sha256 }}"
    mode: "0644"

- name: Smallstep repository
  register: step_ca_repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/smallstep.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: https://packages.smallstep.com/stable/debian
      Suites: debs
      Components: main
      Signed-By: /etc/apt/keyrings/smallstep.asc

- name: Install step-ca and step-cli at the pinned versions
  ansible.builtin.apt:
    name:
      - "step-ca={{ step_ca_version }}"
      - "step-cli={{ step_cli_version }}"
    update_cache: "{{ step_ca_repo.changed }}"

- name: CA user
  ansible.builtin.user:
    name: step
    system: true
    home: "{{ step_ca_home }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: CA directories
  ansible.builtin.file:
    path: "{{ step_ca_home }}/{{ item }}"
    state: directory
    owner: step
    group: step
    mode: "0700"
  loop: ["", secrets]

# The password protects the intermediate key on disk and never leaves the
# guest. The root key is copied offline and removed by the owner; see
# docs/runbooks/step-ca-root-key.md.
- name: Generate the key password once
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    head -c 32 /dev/urandom | base64 > {{ step_ca_home }}/secrets/password
  args:
    executable: /bin/bash
    creates: "{{ step_ca_home }}/secrets/password"

- name: Initialise the CA once
  ansible.builtin.command:
    argv:
      - step
      - ca
      - init
      - --deployment-type=standalone
      - "--name={{ step_ca_name }}"
      - "--dns=step-ca.{{ step_ca_domain }}"
      - "--address=:{{ step_ca_port }}"
      - --provisioner=admin
      - "--password-file={{ step_ca_home }}/secrets/password"
      - "--provisioner-password-file={{ step_ca_home }}/secrets/password"
      - --acme
    creates: "{{ step_ca_home }}/config/ca.json"
  environment:
    STEPPATH: "{{ step_ca_home }}"
  notify: Restart step-ca

- name: Hand the CA files to the step user
  ansible.builtin.file:
    path: "{{ step_ca_home }}"
    owner: step
    group: step
    recurse: true

- name: step-ca service
  ansible.builtin.template:
    src: step-ca.service.j2
    dest: /etc/systemd/system/step-ca.service
    mode: "0644"
  notify: Restart step-ca

- name: Run step-ca
  ansible.builtin.systemd_service:
    name: step-ca
    enabled: true
    state: started
  when: step_ca_manage_services | bool
