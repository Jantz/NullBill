- name: apt through the egress proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/30nullbill-proxy
    mode: "0644"
    content: |
      // Generated by nullbill.
      Acquire::http::Proxy "{{ updates_apt_proxy }}";
      Acquire::https::Proxy "{{ updates_apt_proxy }}";
  when: updates_apt_proxy | length > 0
  tags: [updates_proxy]

- name: No proxy where the guest reaches the mirrors directly
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/30nullbill-proxy
    state: absent
  when: updates_apt_proxy | length == 0
  tags: [updates_proxy]

# Debian's collector exports pending updates by origin, the package lists'
# age and whether a reboot is required (apt_info.py).
- name: Unattended upgrades and node_exporter with its apt collector
  ansible.builtin.apt:
    name: [unattended-upgrades, prometheus-node-exporter, prometheus-node-exporter-collectors]
    install_recommends: false
    update_cache: true

# PVE freezes a VM's file systems through it for consistent backups and
# shuts the VM down through it. Its unit starts once PVE gives the VM the
# agent's virtio port (tofu.py enables it for Linux VMs).
- name: QEMU guest agent in a VM
  ansible.builtin.apt:
    name: qemu-guest-agent
    install_recommends: false
  when: updates_guest_agent | bool

- name: QEMU guest agent running
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
  when: updates_guest_agent | bool and updates_manage_services | bool

- name: Is cloud-init configured here
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: updates_cloud_cfg
  when: updates_keep_host_keys | bool

- name: cloud-init keeps the SSH host keys on a new instance
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/90-nullbill-host-keys.cfg
    content: |
      # Managed by NullBill (updates role): the host keys apply pinned stay.
      ssh_deletekeys: false
    owner: root
    group: root
    mode: "0644"
  when: updates_keep_host_keys | bool and updates_cloud_cfg.stat.isdir | default(false)

- name: needrestart
  ansible.builtin.apt:
    name: needrestart
    install_recommends: false
  when: updates_restart_services | bool

- name: needrestart restarts services without asking
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-nullbill.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      $nrconf{restart} = 'a';
  when: updates_restart_services | bool

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      // Generated by nullbill.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Which updates install unattended
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52nullbill-unattended-upgrades
    mode: "0644"
    content: |
      // Generated by nullbill. Replaces the origins of 50unattended-upgrades.
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
      {% for origin in updates_origins %}
        "{{ origin }}";
      {% endfor %}
      };
      Unattended-Upgrade::Automatic-Reboot "{{ updates_auto_reboot | bool | lower }}";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ updates_reboot_time }}";

- name: State directory
  ansible.builtin.file:
    path: /var/lib/nullbill
    state: directory
    mode: "0755"

- name: When updates were set up, the last success until the first run
  ansible.builtin.copy:
    dest: /var/lib/nullbill/updates-since
    content: ""
    mode: "0644"
    force: false

- name: Update metrics script
  ansible.builtin.copy:
    src: nb-update-metrics
    dest: /usr/local/sbin/nb-update-metrics
    mode: "0755"

- name: Drop-in directory for the apt metrics service
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter-apt.service.d
    state: directory
    mode: "0755"

- name: Update metrics follow each apt metrics run
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus-node-exporter-apt.service.d/nullbill.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Service]
      ExecStartPost=/usr/local/sbin/nb-update-metrics

- name: Services
  when: updates_manage_services | bool
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - prometheus-node-exporter
    - prometheus-node-exporter-apt.timer
    - apt-daily.timer
    - apt-daily-upgrade.timer
