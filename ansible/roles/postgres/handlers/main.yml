- name: Restart postgres
  ansible.builtin.systemd_service:
    name: "postgresql@{{ postgres_version }}-main"
    state: restarted
  when: postgres_manage_services | bool

# A container has no init; pg_ctlcluster runs the server directly.
- name: Restart postgres without systemd
  ansible.builtin.command: pg_ctlcluster {{ postgres_version }} main restart
  changed_when: true
  when: not (postgres_manage_services | bool)
  listen: Restart postgres
