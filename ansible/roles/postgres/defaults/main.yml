# Debian 13 ships PostgreSQL 17; its updates come with Debian's.
postgres_version: 17
# Addresses the server listens on besides localhost: the guest's own.
postgres_listen: []
# One entry per client service: its database, role, password and the only
# address it may connect from. The plan derives name and client from the
# flows into postgres; apply supplies the password from sops.
postgres_databases: []
#  - {name: forgejo, client: 10.42.2.17, password: "..."}
# The certificate the tls_cert role keeps renewed (group postgres), so
# clients connect with sslmode=verify-full against step-ca's root.
postgres_tls_name: postgres.nullbill.internal
postgres_manage_services: true
