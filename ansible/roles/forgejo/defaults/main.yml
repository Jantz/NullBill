# The binary from Forgejo's release, pinned by checksum. The checksum was
# taken from a download whose detached signature verified against Forgejo's
# release key EB114F5E6C0DC2BCDD183550A4B61A2DC5923710. v15 is the LTS
# line (supported to 2027-07-15).
forgejo_version: 17.0.1
forgejo_sha256: 51a8cdf4a1252e79f4b3855d7a7891af6c6635105420768c460e2f0690385d6f
forgejo_url: "https://codeberg.org/forgejo/forgejo/releases/download/v{{ forgejo_version }}/forgejo-{{ forgejo_version }}-linux-amd64"

# The name people and runners use. nginx serves HTTPS on 443; Forgejo's own
# SSH server takes port 22, so the guest runs no OpenSSH server.
forgejo_domain: forgejo.nullbill.internal
forgejo_tls_name: "{{ forgejo_domain }}"
forgejo_ssh_port: 22
# The browser CA's certificate (for the name and the address) and key
# (src/nullbill/browserca.py), and its root: people's browsers and the CI
# runners open Forgejo by the same name, so nginx answers every request with
# it, and the root joins the system store here. apply sets all three; left
# empty, nginx serves the certificate tls_cert keeps renewed for the name
# (group www-data).
forgejo_browser_cert: ""
forgejo_browser_key: ""
forgejo_browser_root: ""

# The shared PostgreSQL, verified against step-ca's root (sslmode
# verify-full). apply supplies the password from sops; the postgres role
# creates the same role and database.
forgejo_db_host: postgres.nullbill.internal
forgejo_db_name: forgejo
forgejo_db_user: forgejo
forgejo_db_password: ""

# The first administrator. Its random password is written once to
# /etc/forgejo/admin-password (root only) and must be changed at first login.
forgejo_admin_user: nullbill-admin
forgejo_admin_email: admin@nullbill.internal

forgejo_manage_services: true
