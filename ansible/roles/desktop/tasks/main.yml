- name: Refuse anything but Fedora
  ansible.builtin.assert:
    that: ansible_facts["distribution"] == "Fedora"
    fail_msg: "The desktop role is written for Fedora; this machine runs {{ ansible_facts['distribution'] }}."

- name: A password for the desktop user
  ansible.builtin.assert:
    that: desktop_password | length >= 12
    fail_msg: "desktop_password is missing or short; apply makes one (secret desktop_password)."
    quiet: true

# Every update, as Fedora's own daily ones install them, before anything
# is added: the KDE packages then match what is installed. dnf itself, not
# Ansible's dnf5 module: Fedora's libdnf5 is built for its own Python, and
# Ansible's modules here run under python3.13 (apply's desktop stage).
- name: Fedora up to date
  ansible.builtin.command: dnf -y upgrade
  register: desktop_upgraded
  changed_when: "'Nothing to do' not in desktop_upgraded.stdout"

# desktop_packages (defaults/main.yml): Plasma, Mesa's drivers, firmware.
- name: KDE Plasma, graphics drivers and the desktop's services
  ansible.builtin.command:
    argv: "{{ ['dnf', '-y', 'install'] + desktop_packages }}"
  register: desktop_installed
  changed_when: "'Nothing to do' not in desktop_installed.stdout"

# The pve-firewall and the router guard the desktop's zone. firewalld,
# which the KDE packages bring, would also shut Remote Desktop and the
# monitoring port.
- name: Which services are installed
  ansible.builtin.service_facts:
  when: desktop_manage_services | bool

- name: No second firewall inside the guest
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
    enabled: false
  when: desktop_manage_services | bool and "firewalld.service" in ansible_facts.services

- name: The desktop user
  ansible.builtin.user:
    name: "{{ desktop_user }}"
    comment: Desktop
    shell: /bin/bash
    groups: [wheel]
    append: true
    create_home: true

- name: nb-desktop
  ansible.builtin.copy:
    src: nb-desktop
    dest: /usr/local/sbin/nb-desktop
    mode: "0755"

# Remote Desktop signs in with it through PAM, and so does the lock screen.
# Set again only when it differs, so the owner's sessions are not touched.
- name: The desktop user's password
  ansible.builtin.command:
    cmd: /usr/local/sbin/nb-desktop password {{ desktop_user }}
    stdin: "{{ desktop_password }}"
  register: desktop_password_set
  changed_when: desktop_password_set.stdout == "changed"
  no_log: true

# A session is there to connect to: Plasma Login Manager signs the user in
# at boot, and Plasma locks at once, so the server's screen shows the lock
# screen. Not again after the session ends (Relogin=false): Remote Desktop
# showed only black on the first real desktop, and the owner chose to try
# it without a new session at once; after a sign-out the greeter waits, and
# Remote Desktop, which runs in the session, is back after a restart.
- name: Sign the desktop user in at boot
  ansible.builtin.copy:
    dest: /etc/plasmalogin.conf.d/50-nullbill.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Autologin]
      User={{ desktop_user }}
      Session=plasma.desktop
      Relogin=false
  notify: Restart the login manager

- name: Lock the screen when the session starts
  ansible.builtin.copy:
    dest: /etc/xdg/kscreenlockerrc
    mode: "0644"
    content: |
      # Generated by nullbill: the session signed in at boot locks at once.
      [Daemon][$i]
      LockOnStart=true

# The account exists, so Plasma's first-run wizard has nothing to make.
- name: Skip Plasma's first-run wizard
  ansible.builtin.copy:
    dest: /etc/plasma-setup-done
    content: ""
    mode: "0644"
    force: false

- name: Boot to the desktop
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

- name: Plasma Login Manager is the display manager
  ansible.builtin.file:
    src: /usr/lib/systemd/system/plasmalogin.service
    dest: /etc/systemd/system/display-manager.service
    state: link
    force: true
  notify: Restart the login manager

- name: Directories for the Remote Desktop certificate and NullBill's settings
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/etc/nullbill, /etc/nullbill/desktop]

- name: Remote Desktop certificate
  ansible.builtin.copy:
    dest: /etc/nullbill/desktop/krdp.crt
    content: "{{ desktop_cert }}"
    mode: "0644"
  when: desktop_cert | length > 0
  notify: Restart Remote Desktop

- name: Remote Desktop key, readable by the desktop user, whose KRDP reads it
  ansible.builtin.copy:
    dest: /etc/nullbill/desktop/krdp.key
    content: "{{ desktop_key }}"
    owner: root
    group: "{{ desktop_user }}"
    mode: "0640"
  when: desktop_key | length > 0
  no_log: true
  notify: Restart Remote Desktop

# The defaults every user reads, made immutable ($i): the port is the one
# the firewall opens, sign-in is the desktop user's own password (PAM), and
# a remote client gets a screen of its own size while the monitor at the
# server goes dark (ExclusiveMode).
- name: KDE's Remote Desktop server settings
  ansible.builtin.copy:
    dest: /etc/xdg/krdpserverrc
    mode: "0644"
    content: |
      # Generated by nullbill.
      [General][$i]
      ListenPort={{ desktop_port }}
      SystemUserEnabled=true
      Autostart=true
      ExclusiveMode=true
      {% if desktop_cert | length > 0 %}
      AutogenerateCertificates=false
      Certificate=/etc/nullbill/desktop/krdp.crt
      CertificateKey=/etc/nullbill/desktop/krdp.key
      {% endif %}
  notify: Restart Remote Desktop

- name: Where nb-desktop reads the port
  ansible.builtin.copy:
    dest: /etc/nullbill/desktop-port
    content: "{{ desktop_port }}\n"
    mode: "0644"

# KRDP's own unit, started with the Plasma session (as its settings page's
# switch does, for every user); its preset leaves it off.
- name: Directory for user units every session starts
  ansible.builtin.file:
    path: /etc/systemd/user/plasma-workspace.target.wants
    state: directory
    mode: "0755"

- name: KRDP starts with the session
  ansible.builtin.file:
    src: /usr/lib/systemd/user/app-org.kde.krdpserver.service
    dest: /etc/systemd/user/plasma-workspace.target.wants/app-org.kde.krdpserver.service
    state: link
  notify: Restart Remote Desktop

# Daily updates, all of them, as the rest of NullBill follows each vendor's
# latest stable (docs/adr/0022-latest-stable.md). Never a restart by itself:
# the owner may be working; monitoring says when one waits.
- name: dnf5-automatic installs every update
  ansible.builtin.copy:
    dest: /etc/dnf/automatic.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      [commands]
      upgrade_type = default
      download_updates = yes
      apply_updates = yes
      reboot = never
      network_online_timeout = 60
      random_sleep = 0

      [emitters]
      emit_via = stdio

- name: State directory
  ansible.builtin.file:
    path: /var/lib/nullbill
    state: directory
    mode: "0755"

- name: When updates were set up, the last success until the first run
  ansible.builtin.copy:
    dest: /var/lib/nullbill/updates-since
    content: ""
    mode: "0644"
    force: false

- name: Drop-in directory for dnf5-automatic
  ansible.builtin.file:
    path: /etc/systemd/system/dnf5-automatic.service.d
    state: directory
    mode: "0755"

- name: Update metrics after each run of dnf5-automatic, failed or not
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnf5-automatic.service.d/nullbill.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Service]
      ExecStopPost=/usr/local/sbin/nb-desktop metrics

- name: Hourly update metrics units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: nb-desktop-metrics.service
      content: |
        # Generated by nullbill.
        [Unit]
        Description=NullBill's update metrics for the desktop

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/nb-desktop metrics
    - name: nb-desktop-metrics.timer
      content: |
        # Generated by nullbill.
        [Unit]
        Description=NullBill's update metrics for the desktop, hourly

        [Timer]
        OnBootSec=5min
        OnUnitActiveSec=1h

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

# The node job's textfile collector reads the update metrics there.
- name: node_exporter reads NullBill's metrics files
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: |
      # Generated by nullbill.
      ARGS='--collector.textfile.directory=/var/lib/prometheus/node-exporter'

- name: Directory for node_exporter's metrics files
  ansible.builtin.file:
    path: /var/lib/prometheus/node-exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

# PVE makes the instance from the VM's cloud-init settings, so a changed
# NIC would otherwise give the VM new host keys (as the updates role does
# on Debian).
- name: cloud-init's settings directory
  ansible.builtin.file:
    path: /etc/cloud/cloud.cfg.d
    state: directory
    mode: "0755"

- name: cloud-init keeps the SSH host keys on a new instance
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/90-nullbill-host-keys.cfg
    mode: "0644"
    content: |
      # Managed by NullBill (desktop role): the host keys apply pinned stay.
      ssh_deletekeys: false

# Whether the desktop is in use, for nb-power (docs/adr/0013-on-demand.md):
# nb-busy as on every guest, and the desktop's own answer in busy.d.
- name: nb-busy
  ansible.builtin.copy:
    src: "{{ role_path }}/../updates/files/nb-busy"
    dest: /usr/local/sbin/nb-busy
    mode: "0755"

- name: Directory for each service's own answer
  ansible.builtin.file:
    path: /etc/nullbill/busy.d
    state: directory
    mode: "0755"

- name: The desktop's own answer to nb-busy
  ansible.builtin.copy:
    dest: /etc/nullbill/busy.d/desktop
    mode: "0755"
    content: |
      #!/bin/sh
      # Generated by nullbill: Remote Desktop, the screen at the server, updates.
      exec /usr/local/sbin/nb-desktop busy

- name: Services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - node_exporter.service
    - qemu-guest-agent.service
    - dnf5-automatic.timer
    - nb-desktop-metrics.timer
  when: desktop_manage_services | bool

- name: Update metrics now
  ansible.builtin.command: /usr/local/sbin/nb-desktop metrics
  changed_when: false
  when: desktop_manage_services | bool

# The kernel's GPU modules come with kernel-modules for the newest kernel;
# until the VM runs it, there is no driver for the card.
- name: Running kernel
  ansible.builtin.command: uname -r
  register: desktop_kernel
  changed_when: false

- name: Newest kernel installed
  ansible.builtin.shell: |
    set -o pipefail
    rpm -q kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: desktop_newest
  changed_when: false

- name: Restart into the newest kernel
  ansible.builtin.reboot:
    reboot_timeout: 900
    msg: "NullBill: restarting into the newest kernel, which has the graphics modules"
  when: desktop_manage_services | bool and desktop_kernel.stdout != desktop_newest.stdout

- name: Flush the handlers before the desktop starts
  ansible.builtin.meta: flush_handlers

- name: The login manager runs, which signs the user in
  ansible.builtin.systemd_service:
    name: plasmalogin.service
    state: started
  when: desktop_manage_services | bool
