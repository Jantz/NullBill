# A new autologin or display manager takes effect at the next start of
# the login manager; restarting it ends the session, so only when it does
# not run yet or its own settings changed.
- name: Restart the login manager
  ansible.builtin.systemd_service:
    name: plasmalogin.service
    state: restarted
    daemon_reload: true
  when: desktop_manage_services | bool

# KRDP runs in the user's session; a running one reads its certificate and
# settings again only when it starts. try-restart leaves one that is off.
- name: Restart Remote Desktop
  ansible.builtin.command: >-
    systemctl --user --machine={{ desktop_user }}@ try-restart app-org.kde.krdpserver.service
  changed_when: true
  failed_when: false
  when: desktop_manage_services | bool
