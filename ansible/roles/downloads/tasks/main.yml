# Run as a dependency of every role that installs packages, before its
# first apt task.
- name: apt retries failed downloads
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20nullbill-retries
    mode: "0644"
    content: |
      // Generated by nullbill.
      Acquire::Retries "{{ downloads_apt_retries }}";
      Acquire::Retries::Delay "true";
      Acquire::Retries::Delay::Maximum "60";
