# Run as a dependency of every role that installs packages, before its
# first apt task.
- name: apt retries failed downloads
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20nullbill-retries
    mode: "0644"
    content: |
      // Generated by nullbill.
      Acquire::Retries "{{ downloads_apt_retries }}";
      Acquire::Retries::Delay "true";
      Acquire::Retries::Delay::Maximum "60";

# Ages from /proc/<pid>/stat against this shell's own start, both counted
# from the host's boot: in a container /proc/uptime is the container's.
- name: No apt-get left stuck by an earlier run
  ansible.builtin.shell: |
    tck=$(getconf CLK_TCK)
    field() { sed 's/.*) //' "/proc/$1/stat" | cut -d' ' -f"$2"; }
    now=$(field self 20)
    for dir in /proc/[0-9]*; do
      pid=${dir#/proc/}
      [ "$(cat "$dir/comm" 2>/dev/null)" = apt-get ] || continue
      start=$(field "$pid" 20 2>/dev/null) || continue
      [ $(( (now - start) / tck )) -ge {{ downloads_apt_stuck_minutes | int * 60 }} ] || continue
      busy=no
      for child in /proc/[0-9]*; do
        [ "$(cat "$child/comm" 2>/dev/null)" = dpkg ] && [ "$(field "${child#/proc/}" 2 2>/dev/null)" = "$pid" ] && busy=yes
      done
      [ "$busy" = no ] || continue
      kill "$pid" 2>/dev/null || continue
      for _ in $(seq 30); do [ -d "$dir" ] || break; sleep 1; done
      kill -9 "$pid" 2>/dev/null || true
      echo "$pid"
    done
  args:
    executable: /bin/sh
  register: downloads_stuck
  changed_when: downloads_stuck.stdout | length > 0
