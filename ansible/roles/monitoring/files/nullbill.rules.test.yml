# promtool test rules: each alert fires on the series it is meant for.
rule_files:
  - nullbill.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="forgejo:9100"}'
        values: "0x10"
      - series: 'node_filesystem_avail_bytes{instance="pbs:9100",mountpoint="/",fstype="ext4"}'
        values: "5x20"
      - series: 'node_filesystem_size_bytes{instance="pbs:9100",mountpoint="/",fstype="ext4"}'
        values: "100x20"
      - series: 'probe_ssl_earliest_cert_expiry{job="tls",instance="forgejo:443"}'
        values: "21000x70"
      - series: 'probe_success{job="tls",instance="forgejo:443"}'
        values: "0x15"
      - series: 'node_boot_time_seconds{job="host",instance="pve.nullbill.internal:9100"}'
        values: "0x60"
      - series: 'nb_pve_api_cert_expiry_timestamp_seconds{job="host",instance="pve"}'
        values: "1209000x70"
    alert_rule_test:
      - eval_time: 59m
        alertname: PveApiCertificateExpires
        exp_alerts: []
      - eval_time: 61m
        alertname: PveApiCertificateExpires
        exp_alerts:
          - exp_labels: {severity: page, job: host, instance: pve}
            exp_annotations: {summary: "the PVE API certificate guests use expires within 14 days; run apply"}
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations: {summary: "NullBill monitoring is alive"}
      - eval_time: 10m
        alertname: HostStarted
        exp_alerts:
          - exp_labels: {severity: warn, job: host, instance: "pve.nullbill.internal:9100"}
            exp_annotations: {summary: "The PVE host started 10m 0s ago, after a power cut or a reboot"}
      - eval_time: 40m
        alertname: HostStarted
        exp_alerts: []
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: page, job: node, instance: "forgejo:9100"}
            exp_annotations: {summary: "node target forgejo:9100 is not answering"}
      - eval_time: 16m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels: {severity: page, instance: "pbs:9100", mountpoint: /, fstype: ext4}
            exp_annotations: {summary: "pbs:9100 / has under 10% free"}
      - eval_time: 29m
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 31m
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels: {severity: page, job: tls, instance: "forgejo:443"}
            exp_annotations: {summary: "certificate on forgejo:443 expires within 6 hours; its renewal has stopped"}
      - eval_time: 11m
        alertname: CertificateProbeFailing
        exp_alerts:
          - exp_labels: {severity: page, job: tls, instance: "forgejo:443"}
            exp_annotations: {summary: "TLS handshake with forgejo:443 fails"}
  # Update alerts, minute by minute (a sample older than five minutes no
  # longer counts). forgejo's runs fail and leave security updates pending;
  # pbs's succeed; router stopped fetching lists and has upgrades off; the
  # host waits on a reboot and on Proxmox updates.
  - interval: 1m
    input_series:
      - series: 'apt_upgrades_pending{instance="forgejo:9100",origin="Debian:bookworm-security/oldstable-security",arch="amd64"}'
        values: "2x3000"
      - series: 'apt_upgrades_pending{instance="pbs:9100",origin="",arch=""}'
        values: "0x3000"
      - series: 'apt_upgrades_pending{instance="pve:9100",origin="Proxmox:bookworm/stable",arch="amd64"}'
        values: "3x20300"
      - series: 'nb_unattended_upgrade_success_timestamp_seconds{instance="forgejo:9100"}'
        values: "0x4500"
      - series: 'nb_unattended_upgrade_success_timestamp_seconds{instance="pbs:9100"}'
        values: "0+60x4500"
      - series: 'nb_unattended_upgrade_enabled{instance="router:9100"}'
        values: "0x200"
      - series: 'nb_unattended_upgrade_enabled{instance="pbs:9100"}'
        values: "1x200"
      - series: 'apt_package_cache_timestamp_seconds{instance="router:9100"}'
        values: "0x3100"
      - series: 'apt_package_cache_timestamp_seconds{instance="pbs:9100"}'
        values: "0+60x3100"
      - series: 'node_reboot_required{instance="pve:9100"}'
        values: "1x4500"
      - series: 'node_reboot_required{instance="pbs:9100"}'
        values: "0x4500"
    alert_rule_test:
      - eval_time: 47h
        alertname: SecurityUpdatesPending
        exp_alerts: []
      - eval_time: 49h
        alertname: SecurityUpdatesPending
        exp_alerts:
          - exp_labels: {severity: page, instance: "forgejo:9100"}
            exp_annotations: {summary: "forgejo:9100 has had security updates waiting for two days; they are not installing"}
      - eval_time: 74h
        alertname: UnattendedUpgradesFailing
        exp_alerts:
          - exp_labels: {severity: page, instance: "forgejo:9100"}
            exp_annotations: {summary: "forgejo:9100 has had no successful unattended upgrade for three days"}
      - eval_time: 2h
        alertname: UnattendedUpgradesOff
        exp_alerts:
          - exp_labels: {severity: page, instance: "router:9100"}
            exp_annotations: {summary: "router:9100 has unattended upgrades switched off"}
      - eval_time: 50h
        alertname: PackageListsStale
        exp_alerts:
          - exp_labels: {severity: page, instance: "router:9100"}
            exp_annotations: {summary: "router:9100 has not fetched package lists for two days; check its mirror and proxy"}
      - eval_time: 73h
        alertname: RebootRequired
        exp_alerts:
          - exp_labels: {severity: warn, instance: "pve:9100"}
            exp_annotations: {summary: "pve:9100 needs a reboot to finish installing updates"}
      - eval_time: 300h
        alertname: UpdatesWaiting
        exp_alerts: []
      - eval_time: 337h
        alertname: UpdatesWaiting
        exp_alerts:
          - exp_labels: {severity: warn, instance: "pve:9100"}
            exp_annotations: {summary: "pve:9100 has had updates waiting for two weeks that NullBill does not install by itself"}
