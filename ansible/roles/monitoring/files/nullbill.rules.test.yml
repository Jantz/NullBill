# promtool test rules: each alert fires on the series it is meant for.
rule_files:
  - nullbill.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node",instance="forgejo:9100"}'
        values: "0x10"
      - series: 'node_filesystem_avail_bytes{instance="pbs:9100",mountpoint="/",fstype="ext4"}'
        values: "5x20"
      - series: 'node_filesystem_size_bytes{instance="pbs:9100",mountpoint="/",fstype="ext4"}'
        values: "100x20"
      - series: 'node_filesystem_readonly{instance="pbs:9100",mountpoint="/",fstype="ext4"}'
        values: "0x20"
      # A kept disk 95% full of the owner's files, read-only or read-write: no page.
      - series: 'node_filesystem_avail_bytes{instance="pve:9100",mountpoint="/mnt/nb-legacy/data",fstype="fuseblk"}'
        values: "5x20"
      - series: 'node_filesystem_size_bytes{instance="pve:9100",mountpoint="/mnt/nb-legacy/data",fstype="fuseblk"}'
        values: "100x20"
      - series: 'node_filesystem_readonly{instance="pve:9100",mountpoint="/mnt/nb-legacy/data",fstype="fuseblk"}'
        values: "1x20"
      - series: 'node_filesystem_avail_bytes{instance="pve:9100",mountpoint="/mnt/nb-legacy/media",fstype="fuseblk"}'
        values: "5x20"
      - series: 'node_filesystem_size_bytes{instance="pve:9100",mountpoint="/mnt/nb-legacy/media",fstype="fuseblk"}'
        values: "100x20"
      - series: 'node_filesystem_readonly{instance="pve:9100",mountpoint="/mnt/nb-legacy/media",fstype="fuseblk"}'
        values: "0x20"
      # The same disk as the files guest shares it: 95% full with room left,
      # and a second share that takes no more.
      - series: 'node_filesystem_avail_bytes{instance="files:9100",mountpoint="/srv/share/media",fstype="fuseblk"}'
        values: "200000000000x20"
      - series: 'node_filesystem_size_bytes{instance="files:9100",mountpoint="/srv/share/media",fstype="fuseblk"}'
        values: "4000000000000x20"
      - series: 'node_filesystem_readonly{instance="files:9100",mountpoint="/srv/share/media",fstype="fuseblk"}'
        values: "0x20"
      - series: 'node_filesystem_avail_bytes{instance="files:9100",mountpoint="/srv/share/photos",fstype="ext4"}'
        values: "500000000x20"
      - series: 'node_filesystem_size_bytes{instance="files:9100",mountpoint="/srv/share/photos",fstype="ext4"}'
        values: "50000000000x20"
      - series: 'node_filesystem_readonly{instance="files:9100",mountpoint="/srv/share/photos",fstype="ext4"}'
        values: "0x20"
      - series: 'node_filesystem_avail_bytes{instance="files:9100",mountpoint="/srv/share/data",fstype="fuseblk"}'
        values: "0x20"
      - series: 'node_filesystem_readonly{instance="files:9100",mountpoint="/srv/share/data",fstype="fuseblk"}'
        values: "1x20"
      - series: 'nb_legacy_disk_mounted{job="host",instance="pve",name="data",mode="ro"}'
        values: "1x5 0x15"
      - series: 'nb_legacy_disk_mounted{job="host",instance="pve",name="media",mode="rw"}'
        values: "1x20"
      - series: 'probe_ssl_earliest_cert_expiry{job="tls",instance="forgejo:443"}'
        values: "21000x70"
      - series: 'probe_success{job="tls",instance="forgejo:443"}'
        values: "0x15"
      - series: 'node_boot_time_seconds{job="host",instance="pve.nullbill.internal:9100"}'
        values: "0x60"
      - series: 'nb_pve_api_cert_expiry_timestamp_seconds{job="host",instance="pve"}'
        values: "1209000x70"
    alert_rule_test:
      - eval_time: 59m
        alertname: PveApiCertificateExpires
        exp_alerts: []
      - eval_time: 61m
        alertname: PveApiCertificateExpires
        exp_alerts:
          - exp_labels: {severity: page, job: host, instance: pve}
            exp_annotations: {summary: "the PVE API certificate guests use expires within 14 days; run apply"}
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations: {summary: "NullBill monitoring is alive"}
      - eval_time: 10m
        alertname: HostStarted
        exp_alerts:
          - exp_labels: {severity: warn, job: host, instance: "pve.nullbill.internal:9100"}
            exp_annotations: {summary: "The PVE host started 10m 0s ago, after a power cut or a reboot"}
      - eval_time: 40m
        alertname: HostStarted
        exp_alerts: []
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: page, job: node, instance: "forgejo:9100"}
            exp_annotations: {summary: "node target forgejo:9100 is not answering"}
      - eval_time: 16m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels: {severity: page, instance: "pbs:9100", mountpoint: /, fstype: ext4}
            exp_annotations: {summary: "pbs:9100 / has under 10% free"}
      - eval_time: 14m
        alertname: KeptDiskFull
        exp_alerts: []
      - eval_time: 16m
        alertname: KeptDiskFull
        exp_alerts:
          - exp_labels: {severity: warn, instance: "files:9100", mountpoint: /srv/share/photos, fstype: ext4}
            exp_annotations: {summary: "the share /srv/share/photos has under 1 GiB left; nothing more can be saved to it until you delete or move files, and the server itself is not affected"}
      - eval_time: 15m
        alertname: LegacyDiskMissing
        exp_alerts: []
      - eval_time: 17m
        alertname: LegacyDiskMissing
        exp_alerts:
          - exp_labels: {severity: page, job: host, instance: pve, name: data, mode: ro}
            exp_annotations: {summary: "kept disk data is not mounted on the host; is it connected? Its share is empty until it is back"}
      - eval_time: 29m
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 31m
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels: {severity: page, job: tls, instance: "forgejo:443", guest: forgejo}
            exp_annotations: {summary: "certificate on forgejo:443 expires within 6 hours; its renewal has stopped"}
      - eval_time: 11m
        alertname: CertificateProbeFailing
        exp_alerts:
          - exp_labels: {severity: page, job: tls, instance: "forgejo:443", guest: forgejo}
            exp_annotations: {summary: "TLS handshake with forgejo:443 fails"}
  # Update alerts, minute by minute (a sample older than five minutes no
  # longer counts). forgejo's runs fail and leave security updates pending;
  # pbs's succeed; router stopped fetching lists and has upgrades off; the
  # host waits on a reboot and on Proxmox updates.
  - interval: 1m
    input_series:
      - series: 'apt_upgrades_pending{instance="forgejo:9100",origin="Debian:bookworm-security/oldstable-security",arch="amd64"}'
        values: "2x3000"
      - series: 'apt_upgrades_pending{instance="pbs:9100",origin="",arch=""}'
        values: "0x3000"
      - series: 'apt_upgrades_pending{instance="pve:9100",origin="Proxmox:bookworm/stable",arch="amd64"}'
        values: "3x20300"
      - series: 'nb_unattended_upgrade_success_timestamp_seconds{instance="forgejo:9100"}'
        values: "0x4500"
      - series: 'nb_unattended_upgrade_success_timestamp_seconds{instance="pbs:9100"}'
        values: "0+60x4500"
      - series: 'nb_unattended_upgrade_enabled{instance="router:9100"}'
        values: "0x200"
      - series: 'nb_unattended_upgrade_enabled{instance="pbs:9100"}'
        values: "1x200"
      - series: 'apt_package_cache_timestamp_seconds{instance="router:9100"}'
        values: "0x3100"
      - series: 'apt_package_cache_timestamp_seconds{instance="pbs:9100"}'
        values: "0+60x3100"
      - series: 'node_reboot_required{instance="pve:9100"}'
        values: "1x4500"
      - series: 'node_reboot_required{instance="pbs:9100"}'
        values: "0x4500"
    alert_rule_test:
      - eval_time: 47h
        alertname: SecurityUpdatesPending
        exp_alerts: []
      - eval_time: 49h
        alertname: SecurityUpdatesPending
        exp_alerts:
          - exp_labels: {severity: page, instance: "forgejo:9100"}
            exp_annotations: {summary: "forgejo:9100 has had security updates waiting for two days; they are not installing"}
      - eval_time: 74h
        alertname: UnattendedUpgradesFailing
        exp_alerts:
          - exp_labels: {severity: page, instance: "forgejo:9100"}
            exp_annotations: {summary: "forgejo:9100 has had no successful unattended upgrade for three days"}
      - eval_time: 2h
        alertname: UnattendedUpgradesOff
        exp_alerts:
          - exp_labels: {severity: page, instance: "router:9100"}
            exp_annotations: {summary: "router:9100 has unattended upgrades switched off"}
      - eval_time: 50h
        alertname: PackageListsStale
        exp_alerts:
          - exp_labels: {severity: page, instance: "router:9100"}
            exp_annotations: {summary: "router:9100 has not fetched package lists for two days; check its mirror and proxy"}
      - eval_time: 73h
        alertname: RebootRequired
        exp_alerts:
          - exp_labels: {severity: warn, instance: "pve:9100"}
            exp_annotations: {summary: "pve:9100 needs a reboot to finish installing updates"}
      - eval_time: 300h
        alertname: UpdatesWaiting
        exp_alerts: []
      - eval_time: 337h
        alertname: UpdatesWaiting
        exp_alerts:
          - exp_labels: {severity: warn, instance: "pve:9100"}
            exp_annotations: {summary: "pve:9100 has had updates waiting for two weeks that NullBill does not install by itself"}
  - interval: 1m
    input_series:
      # forgejo's newest backup stays at the start; git's renews every hour.
      - series: 'nb_backup_last_success_timestamp_seconds{instance="pve:9100",vmid="2017",guest="forgejo"}'
        values: "0x1700"
      - series: 'nb_backup_last_success_timestamp_seconds{instance="pve:9100",vmid="2018",guest="git"}'
        values: "0+60x1700"
      - series: 'nb_backup_status_ok{instance="pve:9100"}'
        values: "0x1700"
      - series: 'node_textfile_mtime_seconds{instance="pve:9100",file="/var/lib/prometheus/node-exporter/nullbill-backups.prom"}'
        values: "0x1700"
      - series: 'nb_backup_restore_ok{instance="pve:9100",vmid="2017",guest="forgejo"}'
        values: "0x1700"
      - series: 'nb_backup_store_bytes{instance="pve:9100",kind="size"}'
        values: "1000x1700"
      - series: 'nb_backup_store_bytes{instance="pve:9100",kind="used"}'
        values: "950x1700"
    alert_rule_test:
      - eval_time: 1h50m
        alertname: BackupRestoreFailing
        exp_alerts: []
      - eval_time: 2h10m
        alertname: BackupRestoreFailing
        exp_alerts:
          - exp_labels: {severity: page, instance: "pve:9100", vmid: "2017", guest: forgejo}
            exp_annotations: {summary: "a file could not be read back from forgejo's newest backup; the page's Backups page says why, and the backups may be unusable until it passes"}
      - eval_time: 1h10m
        alertname: BackupStoreAlmostFull
        exp_alerts:
          - exp_labels: {severity: warn, instance: "pve:9100"}
            exp_annotations: {summary: "the backups fill 95% of their room; give them more on the page's Backups page, or a disk of their own"}
      - eval_time: 26h50m
        alertname: BackupTooOld
        exp_alerts: []
      - eval_time: 27h10m
        alertname: BackupTooOld
        exp_alerts:
          - exp_labels: {severity: page, instance: "pve:9100", vmid: "2017", guest: forgejo}
            exp_annotations: {summary: "forgejo (2017) has no encrypted backup from the last 26 hours"}
      - eval_time: 1h50m
        alertname: BackupStatusUnknown
        exp_alerts: []
      - eval_time: 2h10m
        alertname: BackupStatusUnknown
        exp_alerts:
          - exp_labels: {severity: page, instance: "pve:9100"}
            exp_annotations: {summary: "the PVE host cannot list the backups on PBS; check the pbs guest"}
      - eval_time: 3h20m
        alertname: BackupMetricsStale
        exp_alerts: []
      - eval_time: 3h40m
        alertname: BackupMetricsStale
        exp_alerts:
          - exp_labels: {severity: page, instance: "pve:9100", file: "/var/lib/prometheus/node-exporter/nullbill-backups.prom"}
            exp_annotations: {summary: "pve:9100 has not refreshed its backup metrics for three hours (nb-backup-metrics.timer)"}
  # Samples 4 minutes apart stay inside Prometheus's 5-minute lookback.
  - interval: 4m
    input_series:
      - series: 'nb_ci_image_baked_timestamp_seconds{instance="pve:9100",pool="linux-runner"}'
        values: "0x5500"
    alert_rule_test:
      - eval_time: 14d50m
        alertname: CiImageOld
        exp_alerts: []
      - eval_time: 14d1h10m
        alertname: CiImageOld
        exp_alerts:
          - exp_labels: {severity: page, instance: "pve:9100", pool: linux-runner}
            exp_annotations: {summary: "the linux-runner CI image is over 14 days old and its re-bake keeps failing; run setup and read the ci stage"}
  # A server that is starting (a new world takes minutes) is not down yet.
  - interval: 1m
    input_series:
      - series: 'nb_game_up{job="node",instance="minecraft:9100",game="minecraft"}'
        values: "1x5 0x8 1x5 0x30"
    alert_rule_test:
      - eval_time: 13m
        alertname: GameServerDown
        exp_alerts: []
      - eval_time: 32m
        alertname: GameServerDown
        exp_alerts:
          - exp_labels: {severity: page, job: node, instance: "minecraft:9100", game: minecraft}
            exp_annotations: {summary: "the minecraft server on minecraft:9100 does not answer; its unit keeps restarting it, so read journalctl -u minecraft in that guest"}
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="host",instance="pve:9100"}'
        values: "2000x10 1000x30"
      - series: 'node_memory_MemTotal_bytes{job="host",instance="pve:9100"}'
        values: "16000x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostMemoryLow
        exp_alerts: []
      - eval_time: 27m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels: {severity: warn, job: host, instance: "pve:9100"}
            exp_annotations: {summary: "The PVE host has under 10% of its memory available; stop a guest or lower a container's limit"}
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="model-gateway"}'
        values: "100000000x10 4000000x30"
      - series: 'node_memory_MemTotal_bytes{job="node",instance="model-gateway"}'
        values: "536870912x40"
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="forgejo"}'
        values: "60000000x40"
      - series: 'node_memory_MemTotal_bytes{job="node",instance="forgejo"}'
        values: "1073741824x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: GuestMemoryFull
        exp_alerts: []
      - eval_time: 27m
        alertname: GuestMemoryFull
        exp_alerts:
          - exp_labels: {severity: page, job: node, instance: model-gateway}
            exp_annotations: {summary: "model-gateway has used up its memory and barely runs; restart it in Proxmox; if it fills up again, it needs a larger memory limit"}
  # On demand: the inference workload is off on purpose, Jellyfin is on and
  # down. Nothing pages for what is off; what is on is watched as ever.
  - interval: 1m
    input_series:
      - series: 'nb_power_guest_off{job="host",instance="pve",guest="inference",group="inference"}'
        values: "1x40"
      - series: 'nb_power_guest_off{job="host",instance="pve",guest="model-gateway",group="inference"}'
        values: "1x40"
      - series: 'nb_power_guest_off{job="host",instance="pve",guest="jellyfin",group="media"}'
        values: "0x40"
      - series: 'nb_power_guest_off{job="host",instance="pve",guest="runner-dispatcher",group="linux-ci"}'
        values: "0x40"
      - series: 'up{job="node",instance="inference"}'
        values: "0x40"
      - series: 'up{job="node",instance="jellyfin"}'
        values: "0x40"
      - series: 'probe_success{job="tls",instance="model-gateway.nullbill.internal:4000"}'
        values: "0x40"
      - series: 'probe_success{job="tls",instance="runner-dispatcher.nullbill.internal:8443"}'
        values: "0x40"
      - series: 'probe_ssl_earliest_cert_expiry{job="tls",instance="model-gateway.nullbill.internal:4000"}'
        values: "0x40"
      # Windows desktop (stop: ask) has gone its idle time without use.
      - series: 'nb_power_group_asks{job="host",instance="pve",group="windows-dev",title="Windows desktop"}'
        values: "0x10 1x30"
      - series: 'nb_power_group_idle_seconds{job="host",instance="pve",group="windows-dev",title="Windows desktop"}'
        values: "14400+60x40"
      - series: 'nb_power_used_mib{job="host",instance="pve"}'
        values: "4096x10 6144x30"
      - series: 'nb_power_headroom_mib{job="host",instance="pve"}'
        values: "5000x40"
      - series: 'nb_power_tick_timestamp_seconds{job="host",instance="pve"}'
        values: "0+60x5 300x35"
    alert_rule_test:
      - eval_time: 20m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: page, job: node, instance: jellyfin}
            exp_annotations: {summary: "node target jellyfin is not answering"}
      - eval_time: 20m
        alertname: CertificateProbeFailing
        exp_alerts:
          - exp_labels: {severity: page, job: tls, instance: "runner-dispatcher.nullbill.internal:8443", guest: runner-dispatcher}
            exp_annotations: {summary: "TLS handshake with runner-dispatcher.nullbill.internal:8443 fails"}
      - eval_time: 35m
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 15m
        alertname: OnDemandLeftOn
        exp_alerts: []
      - eval_time: 17m
        alertname: OnDemandLeftOn
        exp_alerts:
          - exp_labels: {severity: warn, job: host, instance: pve, group: windows-dev, title: Windows desktop}
            exp_annotations:
              summary: "Windows desktop is on and has not been used for 4h 17m 0s; stop it on the page (Services) to free its memory, or press Keep on"
      - eval_time: 25m
        alertname: OnDemandOverbooked
        exp_alerts: []
      - eval_time: 27m
        alertname: OnDemandOverbooked
        exp_alerts:
          - exp_labels: {severity: warn, job: host, instance: pve}
            exp_annotations: {summary: "more runs on demand than the plan counts memory for (6144 MiB); stop something on the page (Services)"}
      - eval_time: 24m
        alertname: OnDemandNotWatched
        exp_alerts: []
      - eval_time: 26m
        alertname: OnDemandNotWatched
        exp_alerts:
          - exp_labels: {severity: page, job: host, instance: pve}
            exp_annotations:
              summary: "the PVE host has not looked at what runs on demand for 21m 0s (nb-power.timer); nothing stops by itself until it does"
  # Jellyfin was off for days and started at hour 73: its old success time
  # pages only if apt has still not caught up six hours later.
  - interval: 1m
    input_series:
      - series: 'nb_unattended_upgrade_success_timestamp_seconds{job="node",instance="jellyfin"}'
        values: "0x4900"
      - series: 'apt_package_cache_timestamp_seconds{job="node",instance="jellyfin"}'
        values: "0x4900"
      - series: 'nb_power_guest_started_timestamp_seconds{job="host",instance="pve",guest="jellyfin",group="media"}'
        values: "262800x4900"
    alert_rule_test:
      - eval_time: 78h
        alertname: UnattendedUpgradesFailing
        exp_alerts: []
      - eval_time: 78h
        alertname: PackageListsStale
        exp_alerts: []
      - eval_time: 80h10m
        alertname: UnattendedUpgradesFailing
        exp_alerts:
          - exp_labels: {severity: page, job: node, instance: jellyfin}
            exp_annotations: {summary: "jellyfin has had no successful unattended upgrade for three days"}
      - eval_time: 80h10m
        alertname: PackageListsStale
        exp_alerts:
          - exp_labels: {severity: page, job: node, instance: jellyfin}
            exp_annotations: {summary: "jellyfin has not fetched package lists for two days; check its mirror and proxy"}
