# Generated by nullbill. Failed logins, from the auth logs every guest ships:
# sshd's, and Samba's on the files guest.
groups:
  - name: nullbill-logins
    rules:
      - alert: FailedLogins
        expr: sum by (host) (count_over_time({job="auth"} |~ "Failed password|authentication failure|Invalid user|NT_STATUS_WRONG_PASSWORD|NT_STATUS_NO_SUCH_USER" [5m])) > 5
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "more than 5 failed logins on {{ $labels.host }} in 5 minutes"
