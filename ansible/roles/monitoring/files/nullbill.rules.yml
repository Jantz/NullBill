# Generated by nullbill. Alerts the security baseline asks for that metrics
# can show; failed logins come from Loki's ruler.
groups:
  - name: nullbill
    rules:
      # Always firing. Its repeats ping Healthchecks.io, which tells the
      # owner when they stop: power cut, lost uplink or dead monitoring.
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "NullBill monitoring is alive"
      # After a power cut the host starts by itself (guests follow in boot
      # order); say so, since Healthchecks.io only reports the outage.
      - alert: HostStarted
        expr: time() - node_boot_time_seconds{job="host"} < 1800
        labels: {severity: warn}
        annotations:
          summary: "The PVE host started {{ $value | humanizeDuration }} ago, after a power cut or a reboot"
      # Not a guest that runs on demand and is off (the host's nb-power
      # says which, docs/adr/0013-on-demand.md): that one is down on purpose.
      - alert: TargetDown
        expr: >-
          up == 0
          unless on(instance) label_replace(nb_power_guest_off == 1, "instance", "$1", "guest", "(.+)")
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is not answering"
      # Read-only filesystems cannot fill up; a full disk kept read-only
      # from a previous OS would otherwise page for ever.
      - alert: DiskAlmostFull
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.10
          unless on(instance, mountpoint) node_filesystem_readonly == 1
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has under 10% free"
      # The plan counts containers at part of their limit (catalog.yaml,
      # host.container_share_pct); when they all fill up at once the host
      # runs short and starts swapping.
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{job="host"} / node_memory_MemTotal_bytes{job="host"} < 0.10
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "The PVE host has under 10% of its memory available; stop a guest or lower a container's limit"
      # A guest at its memory limit has no swap to fall back on: it drops and
      # rereads its own program files over and over, answers slowly or not at
      # all, and setup waits on it.
      - alert: GuestMemoryFull
        expr: node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} < 0.05
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }} has used up its memory and barely runs; restart it in Proxmox; if it fills up again, it needs a larger memory limit"
      - alert: CertificateExpiresSoon
        # step-ca certificates last 24 h and renew with 8 h left, so under
        # 6 h means renewal has stopped.
        # A guest on demand that is off answers nothing, and one just
        # started gets a new certificate within the minute (nb-power).
        expr: >-
          label_replace(probe_ssl_earliest_cert_expiry - time() < 6 * 3600, "guest", "$1", "instance", "([^.:]+)[.:].*")
          unless on(guest) nb_power_guest_off == 1
        for: 30m
        labels: {severity: page}
        annotations:
          summary: "certificate on {{ $labels.instance }} expires within 6 hours; its renewal has stopped"
      # nb-pve-api-cert on the host; apply issues a new one under 30 days.
      - alert: PveApiCertificateExpires
        expr: nb_pve_api_cert_expiry_timestamp_seconds - time() < 14 * 86400
        for: 1h
        labels: {severity: page}
        annotations:
          summary: "the PVE API certificate guests use expires within 14 days; run apply"
      - alert: CertificateProbeFailing
        expr: >-
          label_replace(probe_success{job="tls"} == 0, "guest", "$1", "instance", "([^.:]+)[.:].*")
          unless on(guest) nb_power_guest_off == 1
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "TLS handshake with {{ $labels.instance }} fails"
  # Updates (ansible/roles/updates): node_exporter's apt collector and
  # nb-update-metrics on the host and every Linux guest.
  - name: nullbill-updates
    rules:
      - alert: SecurityUpdatesPending
        expr: sum by (instance) (apt_upgrades_pending{origin=~".*-security.*"}) > 0
        for: 2d
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }} has had security updates waiting for two days; they are not installing"
      # A guest on demand that was off for days starts with an old success
      # time; nb-power has apt catch up at once, so give it six hours.
      - alert: UnattendedUpgradesFailing
        expr: >-
          time() - nb_unattended_upgrade_success_timestamp_seconds > 3 * 86400
          unless on(instance) label_replace(time() - nb_power_guest_started_timestamp_seconds < 6 * 3600, "instance", "$1", "guest", "(.+)")
        for: 1h
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }} has had no successful unattended upgrade for three days"
      - alert: UnattendedUpgradesOff
        expr: nb_unattended_upgrade_enabled == 0
        for: 1h
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }} has unattended upgrades switched off"
      - alert: PackageListsStale
        expr: >-
          time() - apt_package_cache_timestamp_seconds > 2 * 86400
          unless on(instance) label_replace(time() - nb_power_guest_started_timestamp_seconds < 6 * 3600, "instance", "$1", "guest", "(.+)")
        for: 1h
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }} has not fetched package lists for two days; check its mirror and proxy"
      - alert: RebootRequired
        expr: node_reboot_required == 1
        for: 3d
        labels: {severity: warn}
        annotations:
          summary: "{{ $labels.instance }} needs a reboot to finish installing updates"
      # Updates that do not install by themselves: Proxmox packages and
      # point releases on the host, pinned Grafana or smallstep versions.
      - alert: UpdatesWaiting
        expr: sum by (instance) (apt_upgrades_pending{origin!~".*-security.*"}) > 0
        for: 14d
        labels: {severity: warn}
        annotations:
          summary: "{{ $labels.instance }} has had updates waiting for two weeks that NullBill does not install by itself"
  # Backups: nb-backup-metrics on the host, hourly (ansible/roles/host_baseline).
  # A failed nightly job shows as the guest's newest backup growing old.
  - name: nullbill-backups
    rules:
      # The host's nb-legacy-disk metrics: a disk kept from a previous OS
      # is not mounted, so its share shows an empty, read-only folder.
      - alert: LegacyDiskMissing
        expr: nb_legacy_disk_mounted == 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "kept disk {{ $labels.name }} is not mounted on the host; is it connected? Its share is empty until it is back"
      - alert: BackupTooOld
        # backups.MAX_AGE_H: a daily job plus slack for a long run.
        expr: time() - nb_backup_last_success_timestamp_seconds > 26 * 3600
        for: 1h
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.guest }} ({{ $labels.vmid }}) has no encrypted backup from the last 26 hours"
      - alert: BackupStatusUnknown
        expr: nb_backup_status_ok == 0
        for: 2h
        labels: {severity: page}
        annotations:
          summary: "the PVE host cannot list the backups on PBS; check the pbs guest"
      - alert: BackupMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*nullbill-backups\\.prom"} > 3 * 3600
        for: 30m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.instance }} has not refreshed its backup metrics for three hours (nb-backup-metrics.timer)"
  # On demand (docs/adr/0013-on-demand.md): the host's nb-power, every
  # minute, for the workloads that are installed and run only when wanted.
  - name: nullbill-on-demand
    rules:
      # stop: ask. It never stops by itself; the owner is told once.
      - alert: OnDemandLeftOn
        expr: nb_power_group_idle_seconds and on(group) nb_power_group_asks == 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "{{ $labels.title }} is on and has not been used for {{ $value | humanizeDuration }}; stop it on the page (Services) to free its memory, or press Keep on"
      # Started around nb-power (in Proxmox, say), or the plan shrank.
      - alert: OnDemandOverbooked
        expr: nb_power_used_mib > nb_power_headroom_mib
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "more runs on demand than the plan counts memory for ({{ $value }} MiB); stop something on the page (Services)"
      - alert: OnDemandNotWatched
        expr: time() - nb_power_tick_timestamp_seconds > 600
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "the PVE host has not looked at what runs on demand for {{ $value | humanizeDuration }} (nb-power.timer); nothing stops by itself until it does"
  # CI images: apply records each bake on the host (nullbill/ci.py) and bakes
  # an image again after a week; the page runs that weekly.
  - name: nullbill-ci
    rules:
      - alert: CiImageOld
        # ci.MAX_IMAGE_AGE_DAYS: two missed weekly re-bakes.
        expr: time() - nb_ci_image_baked_timestamp_seconds > 14 * 86400
        for: 1h
        labels: {severity: page}
        annotations:
          summary: "the {{ $labels.pool }} CI image is over 14 days old and its re-bake keeps failing; run setup and read the ci stage"
  # Game servers: nb-game's metrics from inside each game's guest
  # (ansible/roles/game_server). A guest that is stopped has no such metric.
  - name: nullbill-games
    rules:
      - alert: GameServerDown
        expr: nb_game_up == 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "the {{ $labels.game }} server does not answer in its guest; its unit keeps restarting it, so read journalctl -u {{ $labels.game }} there"
