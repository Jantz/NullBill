- name: Certificates from apply are set
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item) | length > 0
    fail_msg: "{{ item }} is empty; apply issues it"
  loop: [monitoring_loki_tls_cert, monitoring_loki_tls_key, monitoring_shipper_ca]

- name: Prometheus, blackbox exporter, promtool and nginx from Debian
  ansible.builtin.apt:
    name: [prometheus, prometheus-blackbox-exporter, nginx-light]
    update_cache: true

- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Grafana repository key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    checksum: "sha256:{{ monitoring_grafana_repo_signer_sha256 }}"
    mode: "0644"

- name: Grafana repository
  register: monitoring_repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: https://apt.grafana.com
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/grafana.asc

- name: Grafana and Loki at the pinned versions
  ansible.builtin.apt:
    name:
      - "grafana={{ monitoring_grafana_version }}"
      - "loki={{ monitoring_loki_version }}"
    update_cache: "{{ monitoring_repo.changed }}"

# Grafana reads Prometheus here; the operator queries it over the network,
# and pve-firewall admits port 9090 from the operator only.
- name: Prometheus listen address
  ansible.builtin.copy:
    dest: /etc/default/prometheus
    mode: "0644"
    content: |
      # Generated by nullbill.
      ARGS="--web.listen-address={{ monitoring_prometheus_listen }}"
  notify: Restart prometheus

- name: Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    mode: "0755"

- name: Prometheus alert rules
  ansible.builtin.copy:
    src: nullbill.rules.yml
    dest: /etc/prometheus/rules/nullbill.yml
    mode: "0644"
    validate: promtool check rules %s
  notify: Restart prometheus

- name: Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
    validate: promtool check config --syntax-only %s
  notify: Restart prometheus

- name: Blackbox exporter listens on localhost
  ansible.builtin.copy:
    dest: /etc/default/prometheus-blackbox-exporter
    mode: "0644"
    content: |
      # Generated by nullbill.
      ARGS="--config.file=/etc/prometheus/blackbox.yml --web.listen-address=127.0.0.1:9115"
  notify: Restart blackbox

- name: Blackbox modules
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/prometheus/blackbox.yml
    mode: "0644"
    validate: prometheus-blackbox-exporter --config.check --config.file=%s
  notify: Restart blackbox

- name: Loki data directory
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: loki
    mode: "0750"

- name: Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: /etc/loki/config.yml
    mode: "0644"
    validate: loki -verify-config -config.file=%s
  notify: Restart loki

- name: Loki rules directory
  ansible.builtin.file:
    path: /etc/loki/rules/fake
    state: directory
    mode: "0755"

# The ruler reads <directory>/<tenant>/; without auth the tenant is "fake".
- name: Loki alert rules
  ansible.builtin.copy:
    src: loki-rules/nullbill.yml
    dest: /etc/loki/rules/fake/nullbill.yml
    mode: "0644"
  notify: Restart loki

- name: nginx certificate directory
  ansible.builtin.file:
    path: /etc/nginx/nullbill
    state: directory
    mode: "0750"

- name: nginx certificates for the Loki gate
  ansible.builtin.copy:
    dest: "/etc/nginx/nullbill/{{ item.file }}"
    content: "{{ item.value | trim }}\n"
    mode: "{{ item.mode }}"
  loop:
    - {file: loki.crt, value: "{{ monitoring_loki_tls_cert }}", mode: "0644"}
    - {file: loki.key, value: "{{ monitoring_loki_tls_key }}", mode: "0600"}
    - {file: shipper-ca.crt, value: "{{ monitoring_shipper_ca }}", mode: "0644"}
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  notify: Reload nginx

- name: No default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Loki gate
  ansible.builtin.template:
    src: nullbill-loki.conf.j2
    dest: /etc/nginx/conf.d/nullbill-loki.conf
    mode: "0644"
  notify: Reload nginx

- name: nginx accepts its configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Generate the Grafana admin password once
  ansible.builtin.shell: |
    set -o pipefail
    umask 027
    head -c 24 /dev/urandom | base64 > /etc/grafana/admin-password
    chgrp grafana /etc/grafana/admin-password
  args:
    executable: /bin/bash
    creates: /etc/grafana/admin-password

- name: Grafana settings
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Grafana data sources
  ansible.builtin.copy:
    src: datasources.yml
    dest: /etc/grafana/provisioning/datasources/nullbill.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Run the monitoring services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [prometheus, prometheus-blackbox-exporter, loki, grafana-server, nginx]
  when: monitoring_manage_services | bool
