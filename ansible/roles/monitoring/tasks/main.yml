- name: The shipper CA is set
  ansible.builtin.assert:
    that: monitoring_shipper_ca | length > 0
    fail_msg: monitoring_shipper_ca is empty; apply makes it in NULLBILL_HOME

- name: The probe CA is set
  ansible.builtin.assert:
    that: monitoring_probe_ca | length > 0
    fail_msg: monitoring_probe_ca is empty; apply sets it to step-ca's and the browser CA's roots

- name: Certificate from the tls_cert role
  ansible.builtin.stat:
    path: "/etc/nullbill/tls/{{ monitoring_tls_name }}.key"
  register: monitoring_tls_key

- name: The certificate is in place
  ansible.builtin.assert:
    that: monitoring_tls_key.stat.exists
    fail_msg: "run tls-cert.yml for {{ monitoring_tls_name }} with tls_cert_group=www-data first"

- name: Prometheus, Alertmanager, blackbox exporter, promtool, nginx and curl from Debian
  ansible.builtin.apt:
    # curl: verify opens Grafana by name from inside this guest (browserca.py).
    name: [prometheus, prometheus-alertmanager, prometheus-blackbox-exporter, nginx-light, curl]
    update_cache: true

- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Grafana repository key
  ansible.builtin.include_role:
    name: downloads
    tasks_from: fetch
  vars:
    downloads_url: https://apt.grafana.com/gpg.key
    downloads_dest: /etc/apt/keyrings/grafana.asc
    downloads_checksum: "sha256:{{ monitoring_grafana_repo_signer_sha256 }}"
    downloads_mode: "0644"

- name: Grafana repository
  register: monitoring_repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: https://apt.grafana.com
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/grafana.asc

- name: Grafana and Loki at the pinned versions
  ansible.builtin.apt:
    name:
      - "grafana={{ monitoring_grafana_version }}"
      - "loki={{ monitoring_loki_version }}"
    update_cache: "{{ monitoring_repo.changed }}"

# Grafana reads Prometheus here; the operator queries it over the network,
# and pve-firewall admits port 9090 from the operator only.
- name: Prometheus listen address
  ansible.builtin.copy:
    dest: /etc/default/prometheus
    mode: "0644"
    content: |
      # Generated by nullbill.
      ARGS="--web.listen-address={{ monitoring_prometheus_listen }}"
  notify: Restart prometheus

- name: Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    mode: "0755"

- name: Prometheus alert rules
  ansible.builtin.copy:
    src: nullbill.rules.yml
    dest: /etc/prometheus/rules/nullbill.yml
    mode: "0644"
    validate: promtool check rules %s
  notify: Restart prometheus

- name: Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
    validate: promtool check config --syntax-only %s
  notify: Restart prometheus

- name: Alertmanager listens on localhost, without clustering
  ansible.builtin.copy:
    dest: /etc/default/prometheus-alertmanager
    mode: "0644"
    content: |
      # Generated by nullbill.
      ARGS="--web.listen-address=127.0.0.1:9093 --cluster.listen-address="
  notify: Restart alertmanager

- name: Alertmanager routes every alert to the relay
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/prometheus/alertmanager.yml
    mode: "0644"
    validate: amtool check-config %s
  notify: Restart alertmanager

- name: Alert relay configuration directory
  ansible.builtin.file:
    path: /etc/nullbill
    state: directory
    mode: "0755"

# The topic URL is the only thing between a stranger and the owner's
# alerts, so root only; the unit hands it to the relay as a credential.
- name: Alert relay configuration
  ansible.builtin.copy:
    dest: /etc/nullbill/alert-relay.json
    mode: "0600"
    content: "{{ {'listen': '127.0.0.1:' ~ monitoring_relay_port, 'ntfy_url': monitoring_ntfy_url, 'healthchecks_url': monitoring_healthchecks_url} | to_nice_json }}\n"
  no_log: true
  notify: Restart alert relay

- name: Alert relay
  ansible.builtin.copy:
    src: nb-alert-relay
    dest: /usr/local/bin/nb-alert-relay
    mode: "0755"
  notify: Restart alert relay

- name: Alert relay unit
  ansible.builtin.template:
    src: nb-alert-relay.service.j2
    dest: /etc/systemd/system/nb-alert-relay.service
    mode: "0644"
  notify: Restart alert relay

- name: Blackbox exporter listens on localhost
  ansible.builtin.copy:
    dest: /etc/default/prometheus-blackbox-exporter
    mode: "0644"
    content: |
      # Generated by nullbill.
      ARGS="--config.file=/etc/prometheus/blackbox.yml --web.listen-address=127.0.0.1:9115"
  notify: Restart blackbox

- name: Roots the certificate probes trust
  ansible.builtin.copy:
    dest: /etc/prometheus/probe-ca.pem
    content: "{{ monitoring_probe_ca | trim }}\n"
    mode: "0644"
  notify: Restart blackbox

- name: Blackbox modules
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/prometheus/blackbox.yml
    mode: "0644"
    validate: prometheus-blackbox-exporter --config.check --config.file=%s
  notify: Restart blackbox

- name: Loki data directory
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: loki
    mode: "0750"

- name: Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: /etc/loki/config.yml
    mode: "0644"
    validate: loki -verify-config -config.file=%s
  notify: Restart loki

- name: Loki rules directory
  ansible.builtin.file:
    path: /etc/loki/rules/fake
    state: directory
    mode: "0755"

# The ruler reads <directory>/<tenant>/; without auth the tenant is "fake".
- name: Loki alert rules
  ansible.builtin.copy:
    src: loki-rules/nullbill.yml
    dest: /etc/loki/rules/fake/nullbill.yml
    mode: "0644"
  notify: Restart loki

- name: nginx certificate directory
  ansible.builtin.file:
    path: /etc/nginx/nullbill
    state: directory
    mode: "0750"

- name: Shipper CA for the Loki gate
  ansible.builtin.copy:
    dest: /etc/nginx/nullbill/shipper-ca.crt
    content: "{{ monitoring_shipper_ca | trim }}\n"
    mode: "0644"
  notify: Reload nginx

- name: Browser certificate and key for Grafana
  ansible.builtin.copy:
    dest: "/etc/nginx/nullbill/browser.{{ item.ext }}"
    content: "{{ item.value | trim }}\n"
    mode: "{{ item.mode }}"
  loop:
    - {ext: crt, value: "{{ monitoring_browser_cert }}", mode: "0644"}
    - {ext: key, value: "{{ monitoring_browser_key }}", mode: "0600"}
  loop_control:
    label: "browser.{{ item.ext }}"
  no_log: true
  when: monitoring_browser_cert | length > 0
  notify: Reload nginx

- name: No default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Loki gate and Grafana over HTTPS
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/nginx/conf.d/{{ item }}"
    mode: "0644"
  loop: [nullbill-loki.conf, nullbill-grafana.conf]
  notify: Reload nginx

- name: nginx accepts its configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Generate the Grafana admin password once
  ansible.builtin.shell: |
    set -o pipefail
    umask 027
    head -c 24 /dev/urandom | base64 > /etc/grafana/admin-password
    chgrp grafana /etc/grafana/admin-password
  args:
    executable: /bin/bash
    creates: /etc/grafana/admin-password

- name: Grafana settings
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Grafana data sources
  ansible.builtin.copy:
    src: datasources.yml
    dest: /etc/grafana/provisioning/datasources/nullbill.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Run the monitoring services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [prometheus, prometheus-alertmanager, nb-alert-relay, prometheus-blackbox-exporter, loki, grafana-server, nginx]
  when: monitoring_manage_services | bool
