# node_exporter endpoints (host:9100) and TLS endpoints (host:port) whose
# certificates must not expire; the plan fills both from its guests.
monitoring_node_targets: []
monitoring_tls_targets: []
# The step-ca root, so certificate probes verify the chain they report on.
monitoring_ca_file: /usr/local/share/ca-certificates/nullbill-root.crt

# Grafana's signed apt repository, key pinned by checksum. Loki ships there too.
monitoring_grafana_repo_signer_sha256: 3d4029689bc7e4444ec00abafa07f21e9c812b41f1123ab5bbe6f8c3e3f7ff8c
monitoring_grafana_version: 13.2.4
monitoring_loki_version: 3.7.8

# All addresses: the guest firewall limits 9090 to the operator.
monitoring_prometheus_listen: "0.0.0.0:9090"

# Loki itself, on localhost. Other guests reach it through nginx on 3100
# with TLS: anyone the firewall admits may query, only a log shipper with a
# certificate from monitoring_shipper_ca may push, and nobody may delete.
monitoring_loki_internal_port: 3101
monitoring_loki_port: 3100
# nginx's certificate, kept renewed by the tls_cert role (group www-data).
monitoring_tls_name: monitoring.nullbill.internal
# PEM: the shipper CA, whose key stays on the controller, so no guest (and
# not the agent) can mint a push certificate.
monitoring_shipper_ca: ""

monitoring_manage_services: true
