# node_exporter endpoints (host:9100) and TLS endpoints (host:port) whose
# certificates must not expire; the plan fills both from its guests.
monitoring_node_targets: []
monitoring_tls_targets: []
# PEM: step-ca's root and the browser CA's (apply.both_roots), so certificate
# probes verify the chain they report on; Forgejo's name has the browser CA's.
monitoring_probe_ca: ""

# Grafana's signed apt repository, key pinned by checksum. Loki ships there too.
monitoring_grafana_repo_signer_sha256: 3d4029689bc7e4444ec00abafa07f21e9c812b41f1123ab5bbe6f8c3e3f7ff8c
monitoring_grafana_version: 13.2.4
monitoring_loki_version: 3.7.8

# All addresses: the guest firewall limits 9090 to the operator and the
# NullBill page.
monitoring_prometheus_listen: "0.0.0.0:9090"

# Loki itself, on localhost. Other guests reach it through nginx on 3100
# with TLS: anyone the firewall admits may query, only a log shipper with a
# certificate from monitoring_shipper_ca may push, and nobody may delete.
monitoring_loki_internal_port: 3101
monitoring_loki_port: 3100
# Grafana, on localhost too. Browsers reach it through nginx with TLS on
# monitoring_grafana_port, with the browser CA's certificate (apply sets
# monitoring_browser_cert and _key, src/nullbill/browserca.py) or, without
# one, monitoring_tls_name's.
monitoring_grafana_port: 3000
monitoring_grafana_internal_port: 3001
monitoring_browser_cert: ""
monitoring_browser_key: ""
# nginx's certificate, kept renewed by the tls_cert role (group www-data).
monitoring_tls_name: monitoring.nullbill.internal
# PEM: the shipper CA, whose key stays on the controller, so no guest (and
# not the agent) can mint a push certificate.
monitoring_shipper_ca: ""

# Where alerts go (nb-alert-relay). apply sets both from NULLBILL_HOME's
# secrets: the ntfy topic URL it made, and the Healthchecks.io ping URL the
# owner pasted, if any. Empty means that channel stays silent.
monitoring_ntfy_url: ""
monitoring_healthchecks_url: ""
# The egress proxy the relay's sends leave through; empty for none.
monitoring_https_proxy: ""
# On localhost; 9095 is Loki's gRPC port.
monitoring_relay_port: 9097
# How often Watchdog pings Healthchecks.io; give its check a 10 minute
# period and a 10 minute grace.
monitoring_watchdog_interval: 5m
# The PVE host's node_exporter (host:9100), scraped as job "host".
monitoring_host_target: ""

monitoring_manage_services: true
