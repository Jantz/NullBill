- name: Refuse anything but Debian 12 or 13
  ansible.builtin.assert:
    that: ansible_distribution == "Debian" and ansible_distribution_release in host_baseline_pve_keyring
    fail_msg: "host baseline supports PVE 8 (bookworm) and PVE 9 (trixie), found {{ ansible_distribution }} {{ ansible_distribution_release }}"

# Key-only SSH must not lock the owner out. PVE links root's
# authorized_keys into /etc/pve/priv; follow it.
- name: Read root's authorized keys
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
    follow: true
  register: host_baseline_keys

- name: Refuse to disable passwords while root has no key
  ansible.builtin.assert:
    that: host_baseline_keys.stat.exists and host_baseline_keys.stat.size > 0
    fail_msg: /root/.ssh/authorized_keys is missing or empty; add a key before turning passwords off

- name: Key-only SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-nullbill.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PermitEmptyPasswords no
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Check the whole sshd configuration with the drop-in
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Remove enterprise repositories, which fail without a subscription
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: ["*.list", "*.sources"]
    # Matched from the start of each line, hence the leading .*
    contains: '.*enterprise\.proxmox\.com'
  register: host_baseline_enterprise

- name: Delete each enterprise repository file
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ host_baseline_enterprise.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: PVE no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      Signed-By: {{ host_baseline_pve_keyring[ansible_distribution_release] }}

- name: Install auditd and unattended-upgrades
  ansible.builtin.apt:
    name: [auditd, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Audit rules
  ansible.builtin.copy:
    src: 50-nullbill.rules
    dest: /etc/audit/rules.d/50-nullbill.rules
    mode: "0640"
  notify: Load audit rules

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      // Generated by nullbill.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Proxmox packages stay manual: their upgrades can restart services and
# the owner applies them. Only Debian security updates install unattended.
- name: Security-only unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52nullbill-unattended-upgrades
    mode: "0644"
    content: |
      // Generated by nullbill. Replaces the origins of 50unattended-upgrades.
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Run auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: host_baseline_manage_services | bool
