# PVE 8 (bookworm) reached its end of life in 2026-08
# (https://pve.proxmox.com/wiki/FAQ); upgrade it to 9 first.
- name: Refuse anything but PVE 9's Debian 13
  ansible.builtin.assert:
    that: ansible_distribution == "Debian" and ansible_distribution_release == "trixie"
    fail_msg: "host baseline supports PVE 9 (Debian 13, trixie), found {{ ansible_distribution }} {{ ansible_distribution_release }}"

# Key-only SSH must not lock the owner out. PVE links root's
# authorized_keys into /etc/pve/priv; follow it.
- name: Read root's authorized keys
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
    follow: true
  register: host_baseline_keys

- name: Refuse to disable passwords while root has no key
  ansible.builtin.assert:
    that: host_baseline_keys.stat.exists and host_baseline_keys.stat.size > 0
    fail_msg: /root/.ssh/authorized_keys is missing or empty; add a key before turning passwords off

- name: Key-only SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-nullbill.conf
    mode: "0644"
    content: |
      # Generated by nullbill.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PermitEmptyPasswords no
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Check the whole sshd configuration with the drop-in
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Remove enterprise repositories, which fail without a subscription
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: ["*.list", "*.sources"]
    # Matched from the start of each line, hence the leading .*
    contains: '.*enterprise\.proxmox\.com'
  register: host_baseline_enterprise

- name: Delete each enterprise repository file
  register: host_baseline_removed
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ host_baseline_enterprise.files }}"
  loop_control:
    label: "{{ item.path }}"

# Where https://pve.proxmox.com/wiki/Package_Repositories puts it, and where
# the web UI's Repositories panel adds it, so the two never list it twice.
- name: PVE no-subscription repository
  register: host_baseline_repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      Signed-By: {{ host_baseline_pve_keyring }}

# A cache younger than an hour can still predate the source change.
- name: Refresh the package lists after changing sources
  ansible.builtin.apt:
    update_cache: true
  when: host_baseline_repo.changed or host_baseline_removed.changed

- name: Install auditd
  ansible.builtin.apt:
    name: [auditd]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Audit rules
  ansible.builtin.copy:
    src: 50-nullbill.rules
    dest: /etc/audit/rules.d/50-nullbill.rules
    mode: "0640"
  notify: Load audit rules

# Debian security updates install every night. Point releases and Proxmox
# packages stay manual, since Proxmox upgrades restart PVE's services and
# want a full upgrade; monitoring warns when they wait. The host never
# reboots by itself: that takes every guest down, so the owner picks when.
- name: Security updates and their metrics
  ansible.builtin.include_role:
    name: updates
  vars:
    updates_auto_reboot: false
    updates_origins:
      - origin=Debian,codename=${distro_codename}-security,label=Debian-Security
    updates_restart_services: false
    updates_manage_services: "{{ host_baseline_manage_services }}"

# PVE's certificate names only the host's LAN name and address; guests
# reach the API as pve.<domain> on the mgmt bridge (files/nb-pve-api-cert).
- name: API certificate script
  ansible.builtin.copy:
    src: nb-pve-api-cert
    dest: /usr/local/sbin/nb-pve-api-cert
    mode: "0755"

# The runtime agent's root key on the host runs every command through it
# (src/nullbill/hostroot.py), so each is in the journal, which the log
# shipper sends to Loki, before it runs.
- name: Agent command recorder
  ansible.builtin.copy:
    src: "{{ role_path }}/../agent_ssh/files/nb-agent-command"
    dest: /usr/local/sbin/nb-agent-command
    mode: "0755"

# apply runs them before OpenTofu when the plan gives PBS a disk of its own,
# or pins a disk as storage (docs/adr/0007-legacy-disks.md, phase 3).
- name: Backup and storage disk scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop: [nb-backup-disk, nb-storage-disk]

# apply runs it before OpenTofu for each partition the plan keeps from a
# previous OS (docs/adr/0007-legacy-disks.md).
- name: Kept disk scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop: [nb-legacy-disk, nb-legacy-copy]

# The NTFS driver for kept disks, with ntfs-3g.probe and ntfsinfo, which
# tell a volume Windows left hibernated, unclean or marked for chkdsk.
# rsync copies a kept disk before it is converted (nb-legacy-copy); PVE
# depends on it already.
- name: ntfs-3g and rsync, when the plan keeps an NTFS disk
  ansible.builtin.apt:
    name: [ntfs-3g, rsync]
    state: present
  when: host_baseline_ntfs | bool

# Each guest's newest encrypted backup, hourly, for the monitoring role's
# BackupTooOld alert; it writes nothing until the nightly job exists.
- name: Backup metrics script
  ansible.builtin.copy:
    src: nb-backup-metrics
    dest: /usr/local/sbin/nb-backup-metrics
    mode: "0755"

- name: Backup metrics units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: nb-backup-metrics.service
      content: |
        # Generated by nullbill.
        [Unit]
        Description=NullBill backup metrics for node_exporter
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/nb-backup-metrics
    - name: nb-backup-metrics.timer
      content: |
        # Generated by nullbill.
        [Unit]
        Description=NullBill backup metrics every hour
        [Timer]
        OnBootSec=5min
        OnUnitActiveSec=1h
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: host_baseline_backup_units

- name: Backup metrics timer runs
  ansible.builtin.systemd_service:
    name: nb-backup-metrics.timer
    state: started
    enabled: true
    daemon_reload: "{{ host_baseline_backup_units.changed }}"
  when: host_baseline_manage_services | bool

# Whether each kept disk is mounted, every 5 minutes, for LegacyDiskMissing;
# it writes nothing while no disk is kept.
- name: Kept disk metrics units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: nb-legacy-metrics.service
      content: |
        # Generated by nullbill.
        [Unit]
        Description=NullBill kept disk metrics for node_exporter
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/nb-legacy-disk metrics
    - name: nb-legacy-metrics.timer
      content: |
        # Generated by nullbill.
        [Unit]
        Description=NullBill kept disk metrics every 5 minutes
        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=5min
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: host_baseline_legacy_units

- name: Kept disk metrics timer runs
  ansible.builtin.systemd_service:
    name: nb-legacy-metrics.timer
    state: started
    enabled: true
    daemon_reload: "{{ host_baseline_legacy_units.changed }}"
  when: host_baseline_manage_services | bool

- name: Is PVE installed
  ansible.builtin.stat:
    path: /usr/bin/pvenode
  register: host_baseline_pvenode

- name: API certificate that also names the mgmt address
  ansible.builtin.command:
    argv: [/usr/local/sbin/nb-pve-api-cert, "{{ host_baseline_api_name }}", "{{ host_baseline_api_address }}"]
  register: host_baseline_api_cert
  changed_when: host_baseline_api_cert.stdout == "issued"
  when: host_baseline_api_name | length > 0 and host_baseline_pvenode.stat.exists

- name: Run auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: host_baseline_manage_services | bool
