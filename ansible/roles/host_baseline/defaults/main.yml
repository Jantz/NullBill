# Proxmox signs each release's repository with the key its installer
# places here.
host_baseline_pve_keyring:
  bookworm: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
  trixie: /usr/share/keyrings/proxmox-archive-keyring.gpg

# Start, reload and load services. Only the container test turns this off,
# because a container has neither an init system nor kernel audit.
host_baseline_manage_services: true
