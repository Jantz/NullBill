# Proxmox signs PVE 9's repository with the key its installer places here.
host_baseline_pve_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg

# The name and mgmt address guests reach the PVE API at; apply sets both
# (pve.<domain>, zones.mgmt.host_ip). Empty leaves PVE's certificate alone.
host_baseline_api_name: ""
host_baseline_api_address: ""
# PEM certificate and key from NullBill's browser CA for the same name and
# address; apply sets them once the home network is closed. Empty: PVE's CA.
host_baseline_api_cert: ""
host_baseline_api_key: ""

# Start, reload and load services. Only the container test turns this off,
# because a container has neither an init system nor kernel audit.
host_baseline_manage_services: true

# Install ntfs-3g for a disk kept from a previous OS; apply sets it when the
# plan keeps an NTFS partition.
host_baseline_ntfs: false

# nb-power's rules, as JSON text: which workloads run on demand, their
# guests and how each stops (src/nullbill/power.py renders them from the
# plan). The default is no rules: everything always runs.
host_baseline_power: '{"groups": {}, "headroom_mib": 0}'
