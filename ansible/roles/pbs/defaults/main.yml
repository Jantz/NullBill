# PBS 4 is built for trixie, the release of the pbs VM's cloud image
# (catalog.yaml's debian-13-cloud). Proxmox publishes this SHA-256 for the
# key in https://pbs.proxmox.com/docs/installation.html.
pbs_signer_url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
pbs_signer_sha256: 136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45

pbs_datastore: backups
pbs_datastore_path: /mnt/datastore/backups
# The datastore's own disk (apply passes backups.DISK_PATH). Blank, it gets
# an ext4 filesystem labelled pbs_disk_label; holding anything else, the role
# stops. Empty: the datastore is a plain directory, as in the container check.
pbs_disk: ""
pbs_disk_label: nb-backups
# The egress proxy, for the release key; apt already uses it (updates role).
pbs_proxy_url: ""

# The PVE host backs up with this token. DatastoreBackup lets it write
# and read its own snapshots but not delete them, so a compromised host
# cannot remove the history; retention runs on the PBS side.
pbs_client_user: nb-pve@pbs
pbs_client_token: pve
# Created once, root only. apply reads it to configure the PVE storage.
pbs_token_file: /root/nullbill/pbs-token.json

pbs_gc_schedule: daily
pbs_prune:
  schedule: daily
  keep-daily: 7
  keep-weekly: 4
  keep-monthly: 6
# Re-read every chunk of a snapshot once it is 30 days past its last check.
pbs_verify:
  schedule: weekly
  outdated-after: 30

# Start services through systemd. The container test turns this off and
# passes pbs_start_command instead, because a container has no init.
pbs_manage_services: true
pbs_start_command: ""
