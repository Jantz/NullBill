- name: Refuse anything but Debian 12
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Debian"
      - ansible_distribution_release == "bookworm"
    fail_msg: PBS 3 packages are built for Debian 12 (bookworm).

- name: Proxmox release key
  ansible.builtin.get_url:
    url: "{{ pbs_signer_url }}"
    dest: /usr/share/keyrings/proxmox-release-bookworm.gpg
    checksum: "sha512:{{ pbs_signer_sha512 }}"
    mode: "0644"

- name: PBS no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pbs-no-subscription.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: http://download.proxmox.com/debian/pbs
      Suites: bookworm
      Components: pbs-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-release-bookworm.gpg

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present
    # Refresh every run: a cache_valid_time skip has hidden a new source.
    update_cache: true

# The package adds the enterprise repository, which answers 401 without a
# subscription and would fail every later apt update.
- name: Remove the enterprise repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pbs-enterprise.list
    state: absent

- name: Start PBS
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [proxmox-backup, proxmox-backup-proxy]
  when: pbs_manage_services | bool

- name: Start PBS without an init system
  ansible.builtin.command: "{{ pbs_start_command }}"
  changed_when: false
  when: not (pbs_manage_services | bool) and pbs_start_command | length > 0

- name: Datastore directory
  ansible.builtin.file:
    path: "{{ pbs_datastore_path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0750"

- name: Configure script
  ansible.builtin.copy:
    src: pbs-configure
    dest: /usr/local/sbin/nullbill-pbs-configure
    mode: "0755"

- name: Configure spec
  ansible.builtin.copy:
    dest: /etc/proxmox-backup/nullbill.json
    mode: "0600"
    content: "{{ spec | to_nice_json }}\n"
  vars:
    spec:
      datastore: {name: "{{ pbs_datastore }}", path: "{{ pbs_datastore_path }}", gc-schedule: "{{ pbs_gc_schedule }}"}
      client: {user: "{{ pbs_client_user }}", token: "{{ pbs_client_token }}", token_file: "{{ pbs_token_file }}"}
      prune: "{{ pbs_prune }}"
      verify: "{{ pbs_verify }}"

- name: Datastore, client token, ACLs and jobs
  ansible.builtin.command: /usr/local/sbin/nullbill-pbs-configure /etc/proxmox-backup/nullbill.json
  register: pbs_configure
  changed_when: (pbs_configure.stdout | from_json).changed | length > 0
