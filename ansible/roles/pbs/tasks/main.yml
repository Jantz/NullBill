- name: Refuse anything but Debian 13
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Debian"
      - ansible_distribution_release == "trixie"
    fail_msg: PBS 4 packages are built for Debian 13 (trixie).

- name: Datastore disk
  when: pbs_disk | length > 0
  block:
    - name: mkfs.ext4
      ansible.builtin.apt:
        name: e2fsprogs
        state: present

    - name: What the datastore disk holds
      ansible.builtin.command:
        argv: [blkid, -p, -o, export, "{{ pbs_disk }}"]
      register: pbs_disk_probe
      changed_when: false
      # 2: nothing on it.
      failed_when: pbs_disk_probe.rc not in [0, 2]

    - name: Refuse a disk NullBill did not format
      ansible.builtin.assert:
        that:
          - pbs_disk_probe.rc == 2 or ("TYPE=ext4" in pbs_disk_probe.stdout_lines and ("LABEL=" ~ pbs_disk_label) in pbs_disk_probe.stdout_lines)
        fail_msg: >-
          {{ pbs_disk }} holds {{ pbs_disk_probe.stdout_lines | select('match', '^(PT)?TYPE=') | join(', ') }}
          but not the ext4 filesystem labelled {{ pbs_disk_label }} this role makes; it is left as it is.

    - name: Filesystem on the blank datastore disk
      ansible.builtin.command:
        argv: [mkfs.ext4, -q, -m, "0", -L, "{{ pbs_disk_label }}", "{{ pbs_disk }}"]
      when: pbs_disk_probe.rc == 2
      changed_when: true

    - name: Mount unit name
      ansible.builtin.command:
        argv: [systemd-escape, -p, --suffix=mount, "{{ pbs_datastore_path }}"]
      register: pbs_mount_unit
      changed_when: false

    - name: Mount the datastore disk at boot
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pbs_mount_unit.stdout }}"
        mode: "0644"
        content: |
          # Generated by nullbill.
          [Unit]
          Description=PBS datastore disk

          [Mount]
          What={{ pbs_disk }}
          Where={{ pbs_datastore_path }}
          Type=ext4
          Options=defaults,noatime

          [Install]
          WantedBy=local-fs.target

    # PBS must never write into the empty directory under a missing mount.
    - name: Drop-in directory for the PBS proxy
      ansible.builtin.file:
        path: /etc/systemd/system/proxmox-backup-proxy.service.d
        state: directory
        mode: "0755"

    - name: PBS waits for the datastore disk
      ansible.builtin.copy:
        dest: /etc/systemd/system/proxmox-backup-proxy.service.d/nullbill-datastore.conf
        mode: "0644"
        content: |
          # Generated by nullbill.
          [Unit]
          RequiresMountsFor={{ pbs_datastore_path }}

    - name: Mount it now
      ansible.builtin.systemd_service:
        name: "{{ pbs_mount_unit.stdout }}"
        daemon_reload: true
        enabled: true
        state: started
      when: pbs_manage_services | bool

- name: Proxmox release key
  ansible.builtin.include_role:
    name: downloads
    tasks_from: fetch
  vars:
    downloads_url: "{{ pbs_signer_url }}"
    downloads_dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    downloads_checksum: "sha256:{{ pbs_signer_sha256 }}"
    downloads_mode: "0644"
    downloads_proxy: "{{ pbs_proxy_url }}"

- name: PBS no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pbs-no-subscription.sources
    mode: "0644"
    content: |
      # Generated by nullbill.
      Types: deb
      URIs: http://download.proxmox.com/debian/pbs
      Suites: trixie
      Components: pbs-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

# Also before the install, in case an earlier run stopped between the two:
# its apt update would fail on the 401.
- name: No enterprise repository left from an earlier run
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/pbs-enterprise.{{ item }}"
    state: absent
  loop: [list, sources]

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present
    # Refresh every run: a cache_valid_time skip has hidden a new source.
    update_cache: true

# The package adds the enterprise repository, which answers 401 without a
# subscription and would fail every later apt update.
- name: Remove the enterprise repository
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/pbs-enterprise.{{ item }}"
    state: absent
  loop: [list, sources]

- name: Start PBS
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [proxmox-backup, proxmox-backup-proxy]
  when: pbs_manage_services | bool

- name: Start PBS without an init system
  ansible.builtin.command: "{{ pbs_start_command }}"
  changed_when: false
  when: not (pbs_manage_services | bool) and pbs_start_command | length > 0

- name: Datastore directory
  ansible.builtin.file:
    path: "{{ pbs_datastore_path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0750"

- name: Configure script
  ansible.builtin.copy:
    src: pbs-configure
    dest: /usr/local/sbin/nullbill-pbs-configure
    mode: "0755"

- name: Configure spec
  ansible.builtin.copy:
    dest: /etc/proxmox-backup/nullbill.json
    mode: "0600"
    content: "{{ spec | to_nice_json }}\n"
  vars:
    spec:
      datastore: {name: "{{ pbs_datastore }}", path: "{{ pbs_datastore_path }}", gc-schedule: "{{ pbs_gc_schedule }}"}
      client: {user: "{{ pbs_client_user }}", token: "{{ pbs_client_token }}", token_file: "{{ pbs_token_file }}"}
      prune: "{{ pbs_prune }}"
      verify: "{{ pbs_verify }}"

- name: Datastore, client token, ACLs and jobs
  ansible.builtin.command: /usr/local/sbin/nullbill-pbs-configure /etc/proxmox-backup/nullbill.json
  register: pbs_configure
  changed_when: (pbs_configure.stdout | from_json).changed | length > 0
