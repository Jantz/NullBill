- name: Keyring directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Tailscale repository key
  ansible.builtin.include_role:
    name: downloads
    tasks_from: fetch
  vars:
    downloads_url: "{{ vpn_repo_key_url }}"
    downloads_dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    downloads_checksum: "sha256:{{ vpn_repo_signer_sha256 }}"
    downloads_mode: "0644"

- name: Tailscale repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: |
      # Generated by nullbill.
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main

- name: Tailscale at the pinned version
  ansible.builtin.apt:
    name: "tailscale={{ vpn_tailscale_version }}"
    update_cache: true

# Userspace networking: the container needs no tun device, and every
# person's traffic leaves from this guest's own address, which is what the
# firewall layers expect of the vpn guest (tailnet.py). The port is the one
# both firewall layers name and the router passes in from the home router.
- name: tailscaled in userspace networking, on NullBill's port
  ansible.builtin.copy:
    dest: /etc/default/tailscaled
    mode: "0644"
    content: |
      # Generated by nullbill.
      PORT="{{ vpn_port }}"
      FLAGS="--tun=userspace-networking"
  notify: Restart tailscaled

- name: Run tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  when: vpn_manage_services | bool

- name: Apply the flags before logging in
  ansible.builtin.meta: flush_handlers

- name: Login state
  ansible.builtin.command: tailscale status --json
  register: vpn_status
  changed_when: false
  tags: [vpn_login]

- name: Log in once with the owner's auth key
  when: (vpn_status.stdout | from_json).BackendState != "Running" and vpn_auth_key | length > 0
  tags: [vpn_login]
  block:
    - name: The key, readable by root only, for this login
      ansible.builtin.copy:
        dest: /run/nullbill-tailscale-key
        content: "{{ vpn_auth_key }}"
        mode: "0600"
      no_log: true

    - name: Log in as the tagged subnet router
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - --auth-key=file:/run/nullbill-tailscale-key
          - "--advertise-tags={{ vpn_tag }}"
          - "--advertise-routes={{ vpn_routes | join(',') }}"
          - "--hostname={{ vpn_hostname }}"
          - --accept-dns=false
          - --timeout=60s
      changed_when: true
  always:
    - name: No key left behind
      ansible.builtin.file:
        path: /run/nullbill-tailscale-key
        state: absent

- name: Routes and name, kept current once logged in
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--advertise-routes={{ vpn_routes | join(',') }}"
      - "--hostname={{ vpn_hostname }}"
  register: vpn_set
  changed_when: false
  when: (vpn_status.stdout | from_json).BackendState == "Running"
  tags: [vpn_login]
