- name: The page's address and key
  ansible.builtin.assert:
    that:
      - console_url is match('^https://[0-9.]+:[0-9]+/$')
      - console_page_spki is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: console_url and console_page_spki come from apply
  when: console_enabled | bool

- name: On-site screen
  when: console_enabled | bool
  block:
    - name: Kiosk compositor, browser and fonts
      ansible.builtin.apt:
        name: [cage, chromium, fonts-dejavu-core]
        install_recommends: false
        update_cache: true

    # No password, no shell: it only runs the screen. Video and input
    # reach it through logind's seat, not through group membership.
    - name: Screen user
      ansible.builtin.user:
        name: "{{ console_user }}"
        system: true
        shell: /usr/sbin/nologin
        password: "!"
        home: "/var/lib/{{ console_user }}"
        create_home: true

    - name: PAM session for the screen (registers the seat with logind)
      ansible.builtin.copy:
        dest: /etc/pam.d/nullbill-console
        mode: "0644"
        content: |
          # Generated by nullbill.
          auth     required pam_permit.so
          account  required pam_unix.so
          session  required pam_unix.so
          session  required pam_systemd.so

    - name: Browser policy directory
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        mode: "0755"

    - name: The browser opens the NullBill page and nothing else
      ansible.builtin.template:
        src: policy.json.j2
        dest: /etc/chromium/policies/managed/nullbill.json
        mode: "0644"
      notify: Restart console

    - name: Screen unit
      ansible.builtin.template:
        src: nullbill-console.service.j2
        dest: /etc/systemd/system/nullbill-console.service
        mode: "0644"
      notify: Restart console

    - name: Screen runs
      ansible.builtin.systemd_service:
        name: nullbill-console
        enabled: true
        state: started
        daemon_reload: true
      when: console_manage_services | bool

- name: Screen off
  when: not (console_enabled | bool)
  block:
    - name: Is there a screen unit
      ansible.builtin.stat:
        path: /etc/systemd/system/nullbill-console.service
      register: console_unit

    - name: Stop the screen
      ansible.builtin.systemd_service:
        name: nullbill-console
        enabled: false
        state: stopped
      when: console_unit.stat.exists and console_manage_services | bool

    - name: Remove the screen's unit, policy and PAM session
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/nullbill-console.service
        - /etc/chromium/policies/managed/nullbill.json
        - /etc/pam.d/nullbill-console
