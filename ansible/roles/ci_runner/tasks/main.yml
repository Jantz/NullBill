- name: step-ca's root is set
  ansible.builtin.assert:
    that: ci_runner_ca_root | length > 0
    fail_msg: ci_runner_ca_root is empty; apply reads it from step-ca

# The build zone reaches the internet only through the egress proxy: apt
# and the runner download while apply bakes the image, and jobs' apt later.
- name: apt through the egress proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/30nullbill-proxy
    mode: "0644"
    content: |
      // Generated by nullbill.
      Acquire::http::Proxy "{{ ci_runner_proxy_url }}";
      Acquire::https::Proxy "{{ ci_runner_proxy_url }}";
  when: ci_runner_proxy_url | length > 0

- name: Tools jobs and the runner need
  ansible.builtin.apt:
    name: [git, curl, ca-certificates, nodejs]
    update_cache: true

# Clones live for one job and take no updates themselves; the image they
# start from is current as of its last bake.
- name: Every pending update in the image
  ansible.builtin.apt:
    upgrade: safe

- name: Trust step-ca's root
  ansible.builtin.copy:
    dest: /usr/local/share/ca-certificates/nullbill-root.crt
    content: "{{ ci_runner_ca_root | trim }}\n"
    mode: "0644"
  register: ci_runner_root

- name: Rebuild the system trust store
  ansible.builtin.command: update-ca-certificates
  when: ci_runner_root.changed
  changed_when: true

# Jobs run as this user, directly on the throwaway clone.
- name: runner user
  ansible.builtin.user:
    name: runner
    shell: /bin/bash
    password: "!"

- name: Release directory
  ansible.builtin.file:
    path: "/opt/forgejo-runner/{{ ci_runner_version }}"
    state: directory
    mode: "0755"

- name: Forgejo Runner at the pinned version
  ansible.builtin.include_role:
    name: downloads
    tasks_from: fetch
  vars:
    downloads_url: "{{ ci_runner_url }}"
    downloads_dest: "/opt/forgejo-runner/{{ ci_runner_version }}/forgejo-runner"
    downloads_checksum: "sha256:{{ ci_runner_sha256 }}"
    downloads_mode: "0755"
    downloads_proxy: "{{ ci_runner_proxy_url }}"

- name: Forgejo Runner on the path
  ansible.builtin.file:
    src: "/opt/forgejo-runner/{{ ci_runner_version }}/forgejo-runner"
    dest: /usr/local/bin/forgejo-runner
    state: link

- name: Boot-time job pickup
  ansible.builtin.template:
    src: nb-runner-job.j2
    dest: /usr/local/sbin/nb-runner-job
    mode: "0755"

- name: Job pickup unit
  ansible.builtin.template:
    src: nb-runner-job.service.j2
    dest: /etc/systemd/system/nb-runner-job.service
    mode: "0644"

- name: Run the job pickup at boot
  ansible.builtin.systemd_service:
    name: nb-runner-job
    enabled: true
    daemon_reload: true
  when: ci_runner_manage_services | bool
