# qBittorrent without a desktop, built here from its source at a pinned
# release: qBittorrent publishes no such build for Linux, and Debian's is
# a year or more behind. git checks out the tag and the role refuses it
# unless it is still this commit. It builds against Debian's Qt, libtorrent,
# Boost and OpenSSL, whose security updates arrive with the guest's own.
qbittorrent_repo: https://github.com/qbittorrent/qBittorrent.git
qbittorrent_version: 5.3.0
qbittorrent_commit: 9213075dd5f7b352208361c6a84c1c115efc898e
# One compiler at a time: two need more memory than apply lends the guest.
qbittorrent_build_jobs: 1
# uid and gid 1000, which own the kept disks' files in an unprivileged
# container (nb-legacy-disk mounts them so).
qbittorrent_uid: 1000
qbittorrent_port: 8080
qbittorrent_username: nullbill-admin
# The password of its page; apply makes it and the Services page shows it.
qbittorrent_password: ""
# Where the kept disk's downloads folder is bind-mounted.
qbittorrent_store: /downloads
# Downloads pause while the disk has less than this free.
qbittorrent_keep_free_gib: 25
# vpn: everything the client's user sends leaves through the WireGuard
# tunnel below. home: through the guest's own route.
qbittorrent_route: home
# Where it listens for other peers, TCP and UDP (flows.TORRENTS_PORT). From
# home the router passes that port on; behind a VPN nothing reaches it.
qbittorrent_listen_port: 41643
# NullBill's own network, which stays on the guest's ordinary routes.
qbittorrent_base: 10.42.0.0/16
# With route vpn (nullbill/torrents.py's variables): interface, address,
# dns, mtu, endpoint, handshake_s; and the file `wg setconf` reads.
qbittorrent_tunnel: {}
qbittorrent_wg_conf: ""
# Start and restart the units. Only the container check turns this off.
qbittorrent_manage_services: true
