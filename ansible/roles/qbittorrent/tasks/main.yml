- name: qbt group
  ansible.builtin.group:
    name: qbt
    gid: "{{ qbittorrent_uid }}"

- name: qbt user, without a login
  ansible.builtin.user:
    name: qbt
    uid: "{{ qbittorrent_uid }}"
    group: qbt
    home: /var/lib/qbittorrent
    create_home: false
    shell: /usr/sbin/nologin
    password: "!"

# curl and python3: apply, nb-torrents and nullbill verify talk to
# qBittorrent from inside this guest. wireguard-tools is `wg`; the tunnel's
# interface is the host kernel's, whose module apply loads there. The rest
# is what qBittorrent's INSTALL names for a build without a desktop.
- name: What qBittorrent is built with and runs on
  ansible.builtin.apt:
    name: "{{ qbittorrent_packages + (['wireguard-tools'] if qbittorrent_route == 'vpn' else []) }}"
    install_recommends: false
    update_cache: true
  vars:
    qbittorrent_packages:
      - python3
      - curl
      - iproute2
      - git
      - ca-certificates
      - cmake
      - ninja-build
      - g++
      - libboost-dev
      - libssl-dev
      - zlib1g-dev
      - libtorrent-rasterbar-dev
      - qt6-base-dev
      - qt6-base-private-dev
      - qt6-tools-dev
      - libqt6sql6-sqlite

- name: Where this release is built
  ansible.builtin.set_fact:
    qbittorrent_dir: "/opt/qbittorrent/{{ qbittorrent_version }}"

- name: qBittorrent at the pinned release
  ansible.builtin.git:
    repo: "{{ qbittorrent_repo }}"
    dest: "{{ qbittorrent_dir }}/src"
    version: "release-{{ qbittorrent_version }}"
    depth: 1
    # As for llama.cpp (inference role): a second run over the shallow clone
    # of a tag fails in the module's fetch. dest is per release, so a new
    # pin clones afresh; the assert below still checks the commit.
    update: false
  environment: "{{ {'https_proxy': downloads_proxy} if downloads_proxy | default('') else {} }}"
  register: qbittorrent_git

- name: The release is still the pinned commit
  ansible.builtin.assert:
    that: qbittorrent_git.after == qbittorrent_commit
    fail_msg: "release-{{ qbittorrent_version }} is {{ qbittorrent_git.after }} upstream, not {{ qbittorrent_commit }}"

# apply lends the guest memory while this runs (apply.stage_torrents). A
# build that stops part way goes on at the next run; the marker is written
# last, and the build tree goes once the program is installed.
- name: Build qBittorrent without a desktop (takes a while the first time)
  ansible.builtin.shell: |
    set -e
    cmake -G Ninja -S src -B build -DCMAKE_BUILD_TYPE=Release -DGUI=OFF -DCMAKE_INSTALL_PREFIX={{ qbittorrent_dir }}
    cmake --build build -j {{ qbittorrent_build_jobs }}
    cmake --install build
    rm -rf build
    touch .nullbill-built
  args:
    chdir: "{{ qbittorrent_dir }}"
    executable: /bin/bash
    creates: "{{ qbittorrent_dir }}/.nullbill-built"

- name: Releases built before this one
  ansible.builtin.find:
    paths: /opt/qbittorrent
    file_type: directory
    excludes: "{{ qbittorrent_version }}"
  register: qbittorrent_old

- name: Releases built before this one go
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ qbittorrent_old.files }}"
  loop_control:
    label: "{{ item.path }}"

# A guest set up before NullBill built qBittorrent itself has Debian's.
- name: Debian's own qBittorrent goes
  ansible.builtin.apt:
    name: qbittorrent-nox
    state: absent

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: /etc/nullbill}
    # Programs that say why this guest is in use, one reason a line.
    - {path: /etc/nullbill/busy.d}
    - {path: /var/lib/nullbill}
    - {path: /var/lib/qbittorrent, owner: qbt, mode: "0750"}
    # node_exporter's textfile collector (the updates role installs it).
    - {path: /var/lib/prometheus/node-exporter}
  loop_control:
    label: "{{ item.path }}"

# Root's, so that without the kept disk mounted over it the client can
# write nothing here.
- name: Where the downloads folder is mounted
  ansible.builtin.file:
    path: "{{ qbittorrent_store }}"
    state: directory
    mode: "0755"
  # Mounted, it is the kept disk's own folder and not this role's to change.
  when: qbittorrent_store is not ansible.builtin.mount

- name: nb-torrents
  ansible.builtin.copy:
    src: nb-torrents
    dest: /usr/local/sbin/nb-torrents
    mode: "0755"

- name: What nb-torrents goes by
  ansible.builtin.copy:
    dest: /etc/nullbill/torrents.json
    mode: "0644"
    content: |
      {{ {
        "user": "qbt",
        "port": qbittorrent_port,
        "username": qbittorrent_username,
        "store": qbittorrent_store,
        "keep_free_gib": qbittorrent_keep_free_gib,
        "route": qbittorrent_route,
        "listen_port": qbittorrent_listen_port,
        "base": qbittorrent_base,
        "tunnel": qbittorrent_tunnel,
      } | to_json }}
  notify:
    - Restart the tunnel
    - Restart qbittorrent

- name: The password of its page
  ansible.builtin.copy:
    dest: /etc/nullbill/torrents-password
    mode: "0600"
    content: "{{ qbittorrent_password }}\n"
  no_log: true

- name: The VPN's keys and server
  ansible.builtin.copy:
    dest: /etc/nullbill/wg0.conf
    mode: "0600"
    content: "{{ qbittorrent_wg_conf }}"
  no_log: true
  when: qbittorrent_route == "vpn"
  notify: Restart the tunnel

- name: The VPN's DNS servers, for the client alone
  ansible.builtin.copy:
    dest: /etc/nullbill/torrents-resolv.conf
    mode: "0644"
    content: |
      # Generated by nullbill. qBittorrent's unit sees this as /etc/resolv.conf.
      {% for server in qbittorrent_tunnel.dns %}
      nameserver {{ server }}
      {% endfor %}
  when: qbittorrent_route == "vpn"
  notify: Restart qbittorrent

- name: The tunnel's unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nb-tunnel.service
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Unit]
      Description=NullBill: the download client's tunnel to the owner's VPN
      After=network-online.target
      Wants=network-online.target
      Before=qbittorrent.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/nb-torrents tunnel up
      ExecStop=/usr/local/sbin/nb-torrents tunnel down

      [Install]
      WantedBy=multi-user.target
  when: qbittorrent_route == "vpn"
  notify: Restart the tunnel

# No VPN any more: the interface, the rules and the routes go, then the
# files. `removes` makes this run once.
- name: The tunnel stops when downloads no longer go through a VPN
  when: qbittorrent_route != "vpn"
  block:
    - name: The tunnel's unit stops
      ansible.builtin.systemd_service:
        name: nb-tunnel
        enabled: false
        state: stopped
      when: qbittorrent_manage_services | bool
      failed_when: false

    - name: Interface, rules and routes go
      ansible.builtin.command:
        cmd: /usr/local/sbin/nb-torrents tunnel off
        removes: /etc/nullbill/wg0.conf

    - name: The VPN's files go
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nullbill/wg0.conf
        - /etc/nullbill/torrents-resolv.conf
        - /etc/systemd/system/nb-tunnel.service
      notify: Restart qbittorrent

# A new qBittorrent makes up a password of its own for each start until one
# is set: its settings exist, with the page's password, before it starts.
- name: qBittorrent's settings before its first start
  ansible.builtin.command: /usr/local/sbin/nb-torrents first-config
  register: qbittorrent_first
  changed_when: qbittorrent_first.stdout | trim == "changed"

- name: qBittorrent's unit
  ansible.builtin.template:
    src: qbittorrent.service.j2
    dest: /etc/systemd/system/qbittorrent.service
    mode: "0644"
  notify: Restart qbittorrent

# What use of the client is, for one that runs on demand: the updates
# role's nb-busy runs it (docs/adr/0013-on-demand.md).
- name: qBittorrent's answer to nb-busy
  ansible.builtin.copy:
    dest: /etc/nullbill/busy.d/torrents
    mode: "0755"
    content: |
      #!/bin/sh
      # Generated by nullbill. A line while anything downloads or is shared,
      # the page is open or qBittorrent does not answer.
      exec /usr/local/sbin/nb-torrents busy

- name: The every-minute unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nb-torrents.service
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Unit]
      Description=NullBill: pause downloads when the disk runs low, and metrics

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/nb-torrents tick

- name: Its timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/nb-torrents.timer
    mode: "0644"
    content: |
      # Generated by nullbill.
      [Unit]
      Description=NullBill: watch the download client, every minute

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=1min
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

- name: The tunnel is up
  ansible.builtin.systemd_service:
    name: nb-tunnel
    enabled: true
    state: started
    daemon_reload: true
  when: qbittorrent_manage_services | bool and qbittorrent_route == "vpn"

- name: qBittorrent and its timer run
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [qbittorrent, nb-torrents.timer]
  when: qbittorrent_manage_services | bool
