    kind: vm
    zone: windows
    cores: 2
    memory_mib: 4096
    disk_gib: 96
    vmid: 2022
    ip: 10.42.5.22
gpus:
  # Owned by the host and shared; consumers list their VRAM budget in MiB.
  '0000:17:00.0':
    name: NVIDIA Corporation Synthetic GPU 48G
    owner: host-shared
    vram_mib: 49140
    consumers:
      inference: 49140
  # Owned by the host and shared; consumers list their VRAM budget in MiB.
  0000:65:00.0:
    name: NVIDIA Corporation Synthetic GPU 48G
    owner: host-shared
    vram_mib: 49140
    consumers:
      inference: 49140
inference:
  # Chosen for 2 inference GPU(s) by the catalog engine table.
  engine: llama.cpp
  # The largest of the catalog's models that fits the 98280 MiB of VRAM inference has.
  model: qwen3.6-27b
  # The model file; verify expects most of it in VRAM.
  model_mib: 16038
  # Host-shared GPUs that budget VRAM to inference.
  gpus:
    - '0000:17:00.0'
    - 0000:65:00.0
media:
  # No integrated Intel graphics in the probe; switch them on in the firmware to transcode there.
  transcode: cpu
  # Kept disks, read-only. Add each folder as a library in Jellyfin.
  library:
    - /media/data
# Not planned.
games: {}
disks:
  # Kept as it is: mounted read-only under /mnt/nb-legacy and shared to the owner over the VPN as data (docs/runbooks/legacy-disk.md). Not backed up by NullBill; keep a copy elsewhere. Left alone: partition 1 (Microsoft reserved).
  ata-SYNTHETIC_HDD_0002:
    size_gib: 3726
    signatures:
      - gpt
      - ntfs
    health: PASSED
    use: legacy
    partitions: [{fstype: ntfs, label: Data, mode: ro, mount: /mnt/nb-legacy/data, n: 2, share: data, uuid: 0123456789ABCDEF}]
  # Blank, so it becomes the PBS datastore.
  ata-SYNTHETIC_HDD_0003:
    size_gib: 3726
    signatures: []
    health: PASSED
    use: pbs
  # Holds PVE; never touched.
  nvme-SYNTHETIC_NVME_0001:
    size_gib: 1863
    signatures:
      - LVM2_member
      - ext4
      - gpt
      - vfat
    use: system
# PBS on its own disk.
backups:
  target: pbs datastore on ata-SYNTHETIC_HDD_0003
  status: ok
