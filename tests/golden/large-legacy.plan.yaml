# NullBill plan. Generated; change config.yaml instead of this file.
# facts sha256: d76baab06371417f
# Follows the discrete GPU count: none, one, several.
class: large
host:
  threads: 32
  host_mib: 257617
  # Left to PVE itself; pin with host.reserve.memory_mib.
  reserve_mib: 4096
  # VMs in full, containers at 50% of their limit.
  guests_mib: 90880
  # Every guest's memory limit added up; containers take theirs only as they use it.
  limits_mib: 97280
  # Not assigned to any guest.
  unallocated_mib: 162641
  # Off. host.console.enabled shows the NullBill page on a monitor plugged into the server.
  console:
    enabled: false
disk:
  storage: local-lvm
  # Includes one golden template per pool.
  needed_gib: 1648
  free_gib: 1664
  # Holds the downloaded container template and cloud image.
  media: local
domain: nullbill.internal
# Uplink-less bridges; the router guest routes between them.
zones:
  mgmt:
    bridge: vmbr101
    subnet: 10.42.1.0/24
    gateway: 10.42.1.1
    egress: proxy
    host_ip: 10.42.1.254
  services:
    bridge: vmbr102
    subnet: 10.42.2.0/24
    gateway: 10.42.2.1
    egress: direct
  build:
    bridge: vmbr103
    subnet: 10.42.3.0/24
    gateway: 10.42.3.1
    egress: proxy
  inference:
    bridge: vmbr104
    subnet: 10.42.4.0/24
    gateway: 10.42.4.1
    egress: proxy
  windows:
    bridge: vmbr105
    subnet: 10.42.5.0/24
    gateway: 10.42.5.1
    egress: proxy
  access:
    bridge: vmbr106
    subnet: 10.42.6.0/24
    gateway: 10.42.6.1
    egress: direct
  media:
    bridge: vmbr107
    subnet: 10.42.7.0/24
    gateway: 10.42.7.1
    egress: proxy
guests:
  router:
    kind: vm
    zone: mgmt
    cores: 1
    memory_mib: 512
    disk_gib: 4
    vmid: 2001
    attach: all-zones
    # One leg in every planned zone.
    ips:
      mgmt: 10.42.1.1
      services: 10.42.2.1
      build: 10.42.3.1
      inference: 10.42.4.1
      windows: 10.42.5.1
