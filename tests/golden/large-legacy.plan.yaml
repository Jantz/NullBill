people:
  owner-a: owner
  dev-b: default
  friend-c:
    role: friend
    services:
      - forgejo
      - model-gateway
updates:
  # Debian security updates install by themselves on the host and every Linux guest.
  security: nightly
  # When a guest whose update needs a reboot reboots.
  reboot_at: 04:30
  # These wait for the owner: the host takes every guest down, agents run long jobs. Monitoring reminds.
  owner_reboots:
    - host
    - workspace
    - inference
  # Windows Update is not managed by NullBill yet.
  not_managed:
    - windows-runner
    - windows-dev
# Tailscale Personal: free for personal, non-commercial use. One group per role that reaches something; the vpn guest is the tagged device.
tailnet:
  users: 3 of 6
  groups: 2 of 3
  tagged_devices: 1 of 50
owner_supplies:
  - Windows ISO
  - Windows licence
