  # Includes one golden template per pool.
  needed_gib: 788
  free_gib: 800
# Uplink-less bridges; the router guest routes between them.
zones:
  mgmt:
    bridge: vmbr101
    subnet: 10.42.1.0/24
    egress: none
  services:
    bridge: vmbr102
    subnet: 10.42.2.0/24
    egress: none
  build:
    bridge: vmbr103
    subnet: 10.42.3.0/24
    egress: proxy
  inference:
    bridge: vmbr104
    subnet: 10.42.4.0/24
    egress: proxy
  windows:
    bridge: vmbr105
    subnet: 10.42.5.0/24
    egress: proxy
  access:
    bridge: vmbr106
    subnet: 10.42.6.0/24
    egress: none
guests:
  router:
    kind: vm
    zone: mgmt
    cores: 1
    memory_mib: 512
    disk_gib: 4
    attach: all-zones
  egress-proxy:
    kind: lxc
    zone: services
    cores: 1
    memory_mib: 512
    disk_gib: 4
  vpn:
