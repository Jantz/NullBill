gpus:
  # Owned by the host and shared; consumers list their VRAM budget in MiB.
  '0000:01:00.0':
    name: NVIDIA Corporation Synthetic GPU 24G
    owner: host-shared
    vram_mib: 24564
    consumers:
      inference: 24564
inference:
  # Chosen for 1 inference GPU(s) by the catalog engine table.
  engine: llama.cpp
disks:
  # Blank, so it becomes the PBS datastore.
  ata-SYNTHETIC_HDD_0002:
    size_gib: 1863
    signatures: []
    use: pbs
  # Holds PVE; never touched.
  nvme-SYNTHETIC_NVME_0001:
    size_gib: 931
    signatures:
