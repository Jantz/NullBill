[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nullbill"
version = "0.0.0"
description = "Self-hosted dev server on Proxmox VE from one declarative config"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.scripts]
nullbill = "nullbill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nullbill = ["data/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
# The Python scripts roles install and checks run, which have no .py suffix.
extend-include = [
  "ansible/roles/game_factorio/files/nb-factorio-mods",
  "ansible/roles/game_minecraft/files/nb-properties",
  "ansible/roles/game_minecraft/files/nb-tls-tunnel",
  "ansible/roles/game_server/files/nb-game",
  "ansible/roles/host_baseline/files/nb-backup-metrics",
  "ansible/roles/host_baseline/files/nb-power",
  "ansible/roles/jellyfin/files/nb-jellyfin",
  "ansible/roles/log_shipper/files/nb-log-shipper",
  "ansible/roles/operator/files/nb-log-tool-use",
  "ansible/roles/pbs/files/pbs-configure",
  "ansible/roles/router/files/nb-portmap",
  "ansible/roles/runner_dispatcher/files/nb-dispatcher",
  "ansible/roles/step_ca/files/agent-provisioner",
  "tools/game-pins",
  "ansible/roles/updates/files/nb-busy",
  "tools/guest-check/home-router",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
